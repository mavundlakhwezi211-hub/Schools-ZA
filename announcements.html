<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Announcements</title>
<script src="api-client.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;padding:clamp(16px,4vw,32px) clamp(12px,4vw,28px) 112px;background:linear-gradient(135deg,#f3f7ff 0%,#eef4fb 100%);color:#173b5e;}
body.dark-mode{background:linear-gradient(135deg,#0d1a2b 0%,#091420 100%);color:#c8d8e8;}
.container{width:100%;max-width:780px;margin:0 auto;display:grid;gap:clamp(16px,2.5vw,22px);}
.page-header{display:grid;gap:6px;}
.title{font-size:clamp(24px,4vw,30px);font-weight:700;}
.subtitle{font-size:13px;color:#5d6f80;}
body.dark-mode .subtitle,body.dark-mode .history-meta{color:#7a9dba;}
.history-list{display:grid;gap:14px;max-width:680px;}
.history-item{display:grid;gap:13px;padding:clamp(16px,2.5vw,20px);border:1px solid rgba(23,59,94,.1);border-radius:16px;background:#fff;box-shadow:0 8px 20px rgba(13,41,68,.07);}
body.dark-mode .history-item{background:#1a2e44;border-color:rgba(200,216,232,.12);}
.history-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.history-badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#dceeff;color:#173b5e;font-size:11px;font-weight:800;letter-spacing:.06em;}
body.dark-mode .history-badge{background:#1e4a76;color:#c8d8e8;}
.history-status{font-size:12px;color:#3f7d4a;font-weight:700;}
body.dark-mode .history-status{color:#8ed29b;}
.history-message{font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:#173b5e;}
body.dark-mode .history-message{color:#c8d8e8;}
.history-meta{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:11px;border-top:1px solid rgba(23,59,94,.08);font-size:12px;color:#5d6f80;}
body.dark-mode .history-meta{border-color:rgba(200,216,232,.12);}
.history-recipients{font-size:12px;color:#5d6f80;}
body.dark-mode .history-recipients{color:#9bb3cc;}
.empty{padding:20px;text-align:center;color:#5d6f80;border:1px dashed rgba(23,59,94,.2);border-radius:14px;}
body.dark-mode .empty{color:#7a9dba;border-color:rgba(200,216,232,.2);}
.access-denied{display:none;color:#b42318;font-weight:600;}
body.dark-mode .access-denied{color:#f08072;}
.bottom-tab-bar{position:fixed;left:50%;bottom:max(14px,2.5vh);transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:clamp(6px,2vw,12px);padding:clamp(8px,2vw,14px) clamp(10px,2.5vw,16px);border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid rgba(23,59,94,.12);box-shadow:0 18px 35px rgba(13,41,68,.14);z-index:1000;}
body.dark-mode .bottom-tab-bar{background:rgba(19,36,54,.92);border-color:rgba(200,216,232,.12);}
.tab-btn{flex:1;display:grid;place-items:center;width:clamp(48px,7vw,60px);height:clamp(48px,7vw,60px);border:0;background:transparent;color:#173b5e;border-radius:50%;text-decoration:none;font-size:clamp(23px,3.5vw,30px);cursor:pointer;}
.tab-btn.active{background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;}
body.dark-mode .tab-btn{color:#c8d8e8;}
body.dark-mode .tab-btn.active{background:linear-gradient(135deg,#1e4a76,#2a6fa8);}
</style>
</head>
<body>
<div class="container">
    <header class="page-header">
        <h1 class="title">Saved announcements</h1>
        <p class="subtitle" id="schoolLabel"></p>
    </header>
    <main class="history-list" id="announcementHistoryList"></main>
    <div class="access-denied" id="accessDenied">Only administrators can view saved announcements.</div>
</div>
<div class="bottom-tab-bar" id="bottomTabBar" aria-label="Primary navigation"></div>
<script src="tab-bar.js"></script>
<script>
const profile = JSON.parse(localStorage.getItem('schoolProfileData') || '{}');
const role = (profile.role || '').toString().trim().toLowerCase();
const isAdmin = role === 'administrator' || role === 'admin';
const school = (profile.schoolName || profile.schoolSearch || '').toString().trim().toLowerCase();
const list = document.getElementById('announcementHistoryList');
const accessDenied = document.getElementById('accessDenied');
function applyTheme(){ document.body.classList.toggle('dark-mode', localStorage.getItem('schoolDarkMode') === 'true'); }
function render(announcements){
    list.replaceChildren();
    if(!announcements.length){ const empty=document.createElement('div');empty.className='empty';empty.textContent='No saved announcements yet.';list.append(empty);return; }
    announcements.forEach(item=>{
        const date=item.createdAt ? new Date(item.createdAt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}) : 'Date unavailable';
        const method=item.deliveryMethod === 'email' ? 'EMAIL' : item.deliveryMethod === 'sms' ? 'SMS' : 'RECORD';
        const article=document.createElement('article');article.className='history-item';
        const top=document.createElement('div');top.className='history-top';
        const badge=document.createElement('span');badge.className='history-badge';badge.textContent=method;
        const status=document.createElement('span');status.className='history-status';status.textContent=item.deliveryStatus||`${item.sentCount||0} sent, ${item.failedCount||0} failed`;
        top.append(badge,status);
        const message=document.createElement('div');message.className='history-message';message.textContent=item.message||'';
        const recipients=document.createElement('div');recipients.className='history-recipients';recipients.textContent=`${item.sentCount||0} sent · ${item.failedCount||0} failed`;
        const meta=document.createElement('div');meta.className='history-meta';
        const count=document.createElement('span');count.textContent=`${item.recipientCount||0} recipient${item.recipientCount===1?'':'s'}`;
        const created=document.createElement('span');created.textContent=date;
        meta.append(count,created);article.append(top,message,recipients,meta);list.append(article);
    });
}
async function init(){
    applyTheme();
    if(!isAdmin){ accessDenied.style.display='block'; return; }
    document.getElementById('schoolLabel').textContent=profile.schoolName || profile.schoolSearch || '';
    try {
        const result=await window.UrskoolApi.request('api/announcements.php');
        render(result.announcements||[]);
    } catch(error) {
        list.textContent=error.message||'Could not load saved announcements.';
    }
}
init();
</script>
</body>
</html>
