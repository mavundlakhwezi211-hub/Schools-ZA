<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Register</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;padding:clamp(16px,4vw,32px) clamp(12px,4vw,28px) 112px;background:linear-gradient(135deg,#f3f7ff 0%,#eef4fb 100%);color:#173b5e;}
body.dark-mode{background:linear-gradient(135deg,#0d1a2b 0%,#091420 100%);color:#c8d8e8;}
.container{width:100%;max-width:820px;margin:0 auto;display:grid;gap:clamp(16px,2.5vw,22px);}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.title{font-size:clamp(24px,4vw,30px);font-weight:700;}
.date-label{padding-top:5px;color:#5d6f80;font-size:13px;font-weight:700;text-align:right;white-space:nowrap;}
body.dark-mode .date-label{color:#9bb3cc;}
.print-school{display:none;}
button{border:0;border-radius:12px;min-height:44px;padding:11px 15px;background:#173b5e;color:#fff;font-weight:700;cursor:pointer;}
button:hover{background:#0f2a45;}
button.secondary{background:#f4f7fb;color:#173b5e;border:1px solid rgba(23,59,94,.1);}
body.dark-mode button.secondary{background:#1a2e44;color:#c8d8e8;border-color:rgba(200,216,232,.15);}
.register{display:grid;gap:12px;}
.register-header{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.register-title{font-size:18px;font-weight:700;}
.header-actions{display:flex;align-items:center;gap:9px;}
.search-link,.add-student-trigger{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:#173b5e;color:#fff;text-decoration:none;}
.search-link:hover,.add-student-trigger:hover{background:#0f2a45;}
.add-student-trigger{padding:0;font-family:Arial,sans-serif;font-size:26px;line-height:1;}
dialog.add-students-dialog{width:min(480px,calc(100% - 32px));margin:auto;padding:22px;border:1px solid rgba(23,59,94,.16);border-radius:12px;background:#fff;color:#173b5e;box-shadow:0 20px 60px rgba(13,41,68,.28);}
dialog.add-students-dialog::backdrop{background:rgba(7,18,32,.55);backdrop-filter:blur(2px);}
.dialog-title{font-size:20px;margin-bottom:16px;}
.dialog-label{display:block;margin-bottom:8px;font-size:13px;font-weight:700;color:#5d6f80;}
.dialog-input{width:100%;min-height:140px;padding:12px;border:1px solid rgba(23,59,94,.18);border-radius:6px;background:#fbfdff;color:#173b5e;font:inherit;resize:vertical;}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px;}
body.dark-mode dialog.add-students-dialog{background:#132436;color:#c8d8e8;border-color:rgba(200,216,232,.15);}
body.dark-mode .dialog-label{color:#9bb3cc;}
body.dark-mode .dialog-input{background:#1a2e44;color:#c8d8e8;border-color:rgba(200,216,232,.2);}
.attendance-footer{display:flex;justify-content:flex-end;padding-top:16px;border-top:1px solid rgba(23,59,94,.12);}
.attendance-footer button{min-width:180px;}
body.dark-mode .attendance-footer{border-color:rgba(200,216,232,.12);}
.notice{display:none;font-size:13px;font-weight:600;color:#26703a;}
.notice.visible{display:block;}
body.dark-mode .notice{color:#9ee6aa;}
.access-denied{display:none;color:#b42318;font-weight:700;}
body.dark-mode .access-denied{color:#f08072;}
.bottom-tab-bar{position:fixed;left:50%;bottom:max(14px,2.5vh);transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:clamp(6px,2vw,12px);padding:clamp(8px,2vw,14px) clamp(10px,2.5vw,16px);border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid rgba(23,59,94,.12);box-shadow:0 18px 35px rgba(13,41,68,.14);z-index:1000;}
body.dark-mode .bottom-tab-bar{background:rgba(19,36,54,.92);border-color:rgba(200,216,232,.12);}
.tab-btn{flex:1;display:grid;place-items:center;width:clamp(48px,7vw,60px);height:clamp(48px,7vw,60px);border:0;background:transparent;color:#173b5e;border-radius:50%;text-decoration:none;font-size:clamp(23px,3.5vw,30px);cursor:pointer;}
.tab-btn.active{background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;}
body.dark-mode .tab-btn{color:#c8d8e8;}
body.dark-mode .tab-btn.active{background:linear-gradient(135deg,#1e4a76,#2a6fa8);}
@media(max-width:640px){.register-header{flex-wrap:wrap;align-items:center}}
.toolbar{display:grid;grid-template-columns:minmax(170px,1fr) minmax(170px,1fr);align-items:end;gap:12px;}
.toolbar-field{display:grid;gap:6px;min-width:0;}
.toolbar-field label{font-size:12px;font-weight:700;color:#5d6f80;}
.toolbar-field input,.toolbar-field select{width:100%;min-height:42px;padding:8px 10px;border:1px solid rgba(23,59,94,.16);border-radius:6px;background:#fff;color:#173b5e;font-size:14px;}
body.dark-mode .toolbar-field input,body.dark-mode .toolbar-field select{background:#1a2e44;color:#c8d8e8;border-color:rgba(200,216,232,.2);}
.register-table-wrap{max-width:100%;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(23,59,94,.14);background:#fff;overscroll-behavior-x:contain;}
.register-table{width:max-content;min-width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums;}
.register-table th,.register-table td{height:36px;padding:0;border:1px solid rgba(23,59,94,.14);text-align:center;}
.register-table thead th{position:sticky;top:0;z-index:4;background:#e9f1f6;color:#173b5e;font-size:11px;font-weight:700;}
.register-table thead tr:first-child th{height:32px;}
.register-table thead th.student-name-cell,.register-table tbody th.student-name-cell{position:sticky;left:0;z-index:5;width:180px;min-width:180px;text-align:left;padding:0 8px;background:#f5f8fa;}
.register-table thead th.homeroom-head{position:sticky;left:180px;z-index:5;width:58px;min-width:58px;background:#f5f8fa;}
.register-table tbody td.homeroom-cell{position:sticky;left:180px;z-index:2;width:58px;min-width:58px;background:#fff;color:#627485;font-size:10px;}
.register-table tbody th.student-name-cell{z-index:3;color:#173b5e;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.register-table .date-column{width:34px;min-width:34px;}
.register-table .weekend{background:#e8ebed!important;color:#98a2a9!important;}
.register-table .active-date{background:#d6eadf!important;}
.date-head{display:grid;place-items:center;align-content:center;gap:1px;font-size:11px;font-weight:800;color:inherit;}
.date-head small{font-size:9px;font-weight:600;}
.register-table tbody tr:hover td:not(.weekend),.register-table tbody tr:hover th.student-name-cell{background:#f3f8f5;}
.status-cell{display:grid;place-items:center;width:100%;height:100%;min-height:35px;padding:0;border:0;border-radius:0;background:transparent;color:#173b5e;font-size:12px;font-weight:800;cursor:pointer;}
.status-cell:hover{background:#e8f1f7;}
.status-cell.status-a{color:#b42318;}
.status-cell.status-p{color:#26703a;}
.total-cell{width:38px;min-width:38px;background:#f7f9fa;font-size:10px;font-weight:700;}
.group-monthly{background:#dfeaf0!important;}
.group-ytd{background:#e4eee8!important;}
.register-empty{padding:24px 0;color:#5d6f80;}
.register-empty[hidden]{display:none;}
#saveAttendanceBtn:disabled{background:#aab7c1;box-shadow:none;cursor:not-allowed;}
#downloadPdfBtn:disabled{opacity:.55;cursor:not-allowed;}
.print-caption{display:none;}
@media(max-width:720px){.toolbar{grid-template-columns:1fr}.register-title{font-size:16px}}
@media(max-width:640px){
    .register-table thead th.student-name-cell,.register-table tbody th.student-name-cell{width:140px;min-width:140px;}
    .register-table thead th.homeroom-head,.register-table tbody td.homeroom-cell{left:140px;}
}
@media(max-width:560px){
    .header{flex-direction:column;align-items:flex-start;gap:4px;}
    .title{font-size:clamp(21px,6.2vw,26px);}
    .date-label{padding-top:0;text-align:left;white-space:normal;font-size:12px;}
    .header-actions{flex-wrap:wrap;gap:8px;}
    .register-table thead th.student-name-cell,.register-table tbody th.student-name-cell{width:124px;min-width:124px;}
    .register-table thead th.homeroom-head,.register-table tbody td.homeroom-cell{display:none;}
    .register-table .date-column{width:32px;min-width:32px;}
    .register-table th,.register-table td{height:34px;}
    .status-cell{min-height:33px;}
    .attendance-footer button{width:100%;min-width:0;}
    .dialog-actions{justify-content:stretch;}
    .dialog-actions button{flex:1;}
    dialog.add-students-dialog{padding:16px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;}
}
@media(max-width:400px){
    .title{font-size:21px;}
    #downloadPdfBtn{padding:9px 11px;font-size:13px;}
    .register-table thead th.student-name-cell,.register-table tbody th.student-name-cell{width:112px;min-width:112px;}
    .register-table tbody th.student-name-cell{font-size:10px;}
    .date-head{font-size:10px;}
    .date-head small{font-size:8px;}
}
@media print{
    @page{size:landscape;margin:7mm;}
    body,body.dark-mode{padding:0!important;background:#fff!important;color:#111!important;}
    .container{display:block;width:100%;max-width:none;}
    .header{margin-bottom:8px;flex-direction:row;align-items:flex-start;justify-content:space-between;}
    .title{display:none;}
    .print-school{display:block;margin:0;font-size:16px;font-weight:700;color:#111;}
    .date-label{font-size:10px!important;color:#333!important;white-space:nowrap;text-align:right;padding-top:5px;}
    .toolbar,.register-header,.attendance-footer,.notice,.bottom-tab-bar,.add-students-dialog,.access-denied,.register-empty{display:none!important;}
    .register{display:block;}
    .register-table-wrap{overflow:visible;border:0;}
    .register-table{width:100%;min-width:0;table-layout:fixed;font-size:6.5px;}
    .register-table th,.register-table td{height:19px;border:1px solid #777!important;}
    .register-table thead th{position:static;background:#e8edf0!important;color:#111!important;font-size:7px;}
    .register-table thead th.student-name-cell,.register-table tbody th.student-name-cell{position:static;width:22%;min-width:0;padding:1px 3px;text-align:left;background:#fff!important;color:#111!important;}
    .register-table thead th.homeroom-head,.register-table tbody td.homeroom-cell{display:table-cell;position:static;width:5%;min-width:0;background:#fff!important;color:#111!important;}
    .register-table tbody th.student-name-cell{height:auto;white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;line-height:1.15;font-size:7px;}
    .register-table .date-column{width:auto;min-width:0;}
    .status-cell{min-height:0;height:auto;font-size:7px;color:#111!important;}
    .total-cell{width:auto;min-width:0;background:#f3f3f3!important;font-size:6px;}
    .weekend{background:#e8e8e8!important;color:#777!important;}
    .print-caption{display:table-caption;text-align:left;font-weight:700;font-size:10px;padding-bottom:5px;}
}
</style>
</head>
<body>
<div class="container">
    <header class="header">
        <div>
            <h1 class="title">Attendance register</h1>
            <p class="print-school" id="printSchoolName"></p>
        </div>
        <time class="date-label" id="currentDate"></time>
    </header>

    <main id="attendancePage" hidden>
        <section class="register">
            <div class="register-header">
                <h2 class="register-title" id="registerTitle">Monthly Attendance Register</h2>
                <div class="header-actions">
                    <button class="secondary" type="button" id="downloadPdfBtn" disabled title="Download this register as a PDF">Download PDF</button>
                    <button class="add-student-trigger" type="button" id="openAddStudents" aria-label="Add student names" title="Add students">+</button>
                    <a class="search-link" href="search-students.html" aria-label="Search students" title="Search students">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.2 4.2"></path></svg>
                    </a>
                </div>
            </div>
            <div class="toolbar">
                <div class="toolbar-field">
                    <label for="monthSelect">Month / Year</label>
                    <input id="monthSelect" type="month">
                </div>
                <div class="toolbar-field">
                    <label for="classSelect">Class / Grade</label>
                    <select id="classSelect" aria-label="Select class"></select>
                </div>
            </div>
            <a id="classSetupLink" href="settings.html" hidden>Add your class in Settings</a>
            <div class="register-table-wrap">
                <table class="register-table" id="registerTable" aria-label="Monthly attendance ledger"></table>
            </div>
            <p class="register-empty" id="registerEmpty" hidden></p>
            <div class="notice" id="saveNotice" role="status"></div>
        </section>
        <footer class="attendance-footer">
            <button type="button" id="saveAttendanceBtn" disabled>Save register</button>
        </footer>
    </main>
    <div class="access-denied" id="accessDenied">Only teachers can use the attendance register.</div>
</div>
<dialog class="add-students-dialog" id="addStudentDialog" aria-labelledby="addStudentsTitle">
    <form id="addStudentsForm">
        <h2 class="dialog-title" id="addStudentsTitle">Add students to class</h2>
        <label class="dialog-label" for="studentNamesInput">Student names — write one per line</label>
        <textarea class="dialog-input" id="studentNamesInput" placeholder="Ronan Song&#10;Ntando Nkuna"></textarea>
        <div class="dialog-actions">
            <button class="secondary" type="button" id="cancelAddStudents">Cancel</button>
            <button type="submit">Add students</button>
        </div>
    </form>
</dialog>
<div class="bottom-tab-bar" id="bottomTabBar" aria-label="Primary navigation"></div>
<script src="tab-bar.js"></script>
<script src="attendance.js"></script>
</body>
</html>
