<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Post</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;padding:clamp(16px,4vw,32px) clamp(12px,4vw,28px) 112px;background:linear-gradient(135deg,#f3f7ff 0%,#eef4fb 100%);color:#173b5e;transition:background .3s ease,color .3s ease;}
body.dark-mode{background:linear-gradient(135deg,#0d1a2b 0%,#091420 100%);color:#c8d8e8;}
.container{width:100%;max-width:720px;margin:0 auto;display:grid;gap:clamp(14px,2.5vw,20px);}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 4px;}
.title{font-size:clamp(24px,4vw,30px);font-weight:700;}
.composer{display:grid;gap:20px;max-width:640px;padding:0;}
.field{display:grid;gap:8px;}
.field label{font-size:13px;font-weight:700;color:#5d6f80;}
body.dark-mode .field label{color:#9bb3cc;}
textarea,input[type="text"]{width:100%;border:1px solid rgba(23,59,94,.16);border-radius:14px;padding:13px 14px;font-size:15px;color:#173b5e;outline:none;background:#fbfdff;}
textarea{min-height:150px;resize:vertical;line-height:1.5;}
textarea:focus,input[type="text"]:focus{border-color:#3a79b8;box-shadow:0 0 0 3px rgba(58,121,184,.14);}
textarea.over-limit{border-color:#b42318;box-shadow:0 0 0 3px rgba(180,35,24,.12);}
.word-limit-warning{display:none;color:#b42318;font-size:13px;font-weight:600;}
.word-limit-warning.visible{display:block;}
body.dark-mode textarea,body.dark-mode input[type="text"]{background:#1a2e44;border-color:rgba(200,216,232,.2);color:#c8d8e8;}
body.dark-mode textarea::placeholder,body.dark-mode input[type="text"]::placeholder{color:#7a9dba;}
body.dark-mode textarea.over-limit{border-color:#f08072;box-shadow:0 0 0 3px rgba(240,128,114,.12);}
body.dark-mode .word-limit-warning{color:#f08072;}
.file-row{display:flex;align-items:center;gap:10px;}
.file-row input[type="text"]{flex:1;min-width:0;}
input[type="file"]{display:none;}
.file-button{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 8px 18px rgba(13,41,68,.16);}
.file-button:hover{background:linear-gradient(135deg,#0f2a45,#2a6fa8);}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.action-group{display:flex;gap:10px;flex-wrap:wrap;}
button,a{font:600 14px Georgia,'Times New Roman',serif;}
button{border:0;border-radius:12px;padding:12px 16px;min-height:44px;font-weight:700;cursor:pointer;background:#173b5e;color:#fff;box-shadow:0 8px 16px rgba(13,41,68,.14);}
button:hover{background:#0f2a45;}
button.secondary{background:#f4f7fb;color:#173b5e;border:1px solid rgba(23,59,94,.1);box-shadow:none;}
button.secondary:hover{background:#eaf2fa;}
.publish{background:linear-gradient(135deg,#173b5e,#3a79b8);}
.publish:hover{background:linear-gradient(135deg,#0f2a45,#2a6fa8);}
.poll-modal{display:none;position:fixed;inset:0;z-index:2000;align-items:center;justify-content:center;padding:18px;background:rgba(7,18,32,.58);}
.poll-modal.open{display:flex;}
.poll-dialog{width:min(460px,100%);display:grid;gap:18px;padding:22px;border-radius:18px;background:#fff;box-shadow:0 20px 50px rgba(7,18,32,.3);}
body.dark-mode .poll-dialog{background:#132436;color:#c8d8e8;}
.poll-dialog h2{font-size:20px;}
.poll-options{display:grid;gap:10px;}
.poll-option-row{display:flex;gap:8px;}
.poll-option-row input{flex:1;min-width:0;}
.remove-option{width:44px;padding:0;background:#fcebea;color:#b42318;box-shadow:none;}
.add-option{justify-self:start;background:transparent;color:#3a79b8;box-shadow:none;padding:4px 0;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;}
body.dark-mode .remove-option{background:rgba(180,35,24,.15);color:#f08072;}
body.dark-mode .add-option{color:#7fb4dc;}
.access-denied{display:none;background:#fff;border:1px solid rgba(180,35,24,.16);border-radius:18px;padding:24px;color:#b42318;}
body.dark-mode .access-denied{background:#132436;border-color:rgba(240,128,114,.25);color:#f08072;}
.bottom-tab-bar{position:fixed;left:50%;bottom:max(14px,2.5vh);transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:clamp(6px,2vw,12px);padding:clamp(8px,2vw,14px) clamp(10px,2.5vw,16px);border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(23,59,94,.12);box-shadow:0 18px 35px rgba(13,41,68,.14);z-index:1000;}
body.dark-mode .bottom-tab-bar{background:rgba(19,36,54,.92);border-color:rgba(200,216,232,.12);box-shadow:0 18px 35px rgba(0,0,0,.3);}
.tab-btn{flex:1;display:grid;place-items:center;width:clamp(48px,7vw,60px);height:clamp(48px,7vw,60px);border:0;background:transparent;color:#173b5e;border-radius:50%;text-decoration:none;font-size:clamp(23px,3.5vw,30px);cursor:pointer;}
.tab-btn.active{background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;box-shadow:0 10px 22px rgba(23,59,94,.2);}
body.dark-mode .tab-btn{color:#c8d8e8;}
body.dark-mode .tab-btn.active{background:linear-gradient(135deg,#1e4a76,#2a6fa8);}
@media(max-width:540px){.header{align-items:flex-start;flex-direction:column;gap:6px}.actions{align-items:stretch;flex-direction:column}.publish{width:100%}.file-row{align-items:stretch}.file-button{height:46px;}}
</style>
</head>
<body>
<div class="container">
    <header class="header">
        <div>
            <h1 class="title">Create post</h1>
        </div>
    </header>

    <main class="composer" id="composer" hidden>
        <div class="field">
            <label for="postText">Post</label>
            <textarea id="postText" maxlength="5000" placeholder="Write a status update, announcement, or statement..."></textarea>
            <div class="word-limit-warning" id="wordLimitWarning" role="alert"></div>
        </div>

        <div class="field">
            <label for="imageUrl">Photo (optional)</label>
            <div class="file-row">
                <input type="text" id="imageUrl" placeholder="Paste an image URL">
                <button class="file-button" type="button" id="pickPhotoBtn" aria-label="Choose image file">+</button>
                <input type="file" id="imageFile" accept="image/*">
            </div>
        </div>

        <div class="actions">
            <button class="secondary" type="button" id="createPollBtn">Create a Poll</button>
            <button class="publish" type="button" id="publishBtn">Publish post</button>
        </div>
    </main>

    <div class="access-denied" id="accessDenied">Only administrators can create posts. Returning to the community feed...</div>
</div>

<div class="bottom-tab-bar" id="bottomTabBar" aria-label="Primary navigation"></div>

<div class="poll-modal" id="pollModal" role="dialog" aria-modal="true" aria-labelledby="pollTitle">
    <form class="poll-dialog" id="pollForm">
        <h2 id="pollTitle">Create a Poll</h2>
        <div class="field">
            <label for="pollQuestion">Poll question</label>
            <input type="text" id="pollQuestion" maxlength="200" placeholder="What would you like to ask?">
        </div>
        <div class="field">
            <label>Poll options</label>
            <div class="poll-options" id="pollOptionsList">
                <div class="poll-option-row"><input class="poll-option-input" type="text" maxlength="100" placeholder="Option 1"><button class="remove-option" type="button" aria-label="Remove option" hidden>×</button></div>
                <div class="poll-option-row"><input class="poll-option-input" type="text" maxlength="100" placeholder="Option 2"><button class="remove-option" type="button" aria-label="Remove option" hidden>×</button></div>
            </div>
            <button class="add-option" type="button" id="addPollOptionBtn">+ Add</button>
        </div>
        <div class="modal-actions">
            <button class="secondary" type="button" id="cancelPollBtn">Cancel</button>
            <button type="submit">Create Poll</button>
        </div>
    </form>
</div>

<script src="tab-bar.js"></script>
<script>
const storageKey = 'schoolAdminFeed';
const profileStorageKey = 'schoolProfileData';
const savedProfile = JSON.parse(localStorage.getItem(profileStorageKey) || '{}');
const role = (savedProfile.role || '').toString().trim().toLowerCase();
const isAdmin = role === 'administrator' || role === 'admin';
const currentSchool = (savedProfile.schoolName || savedProfile.schoolSearch || '').toString().trim();
const userEmail = (savedProfile.email || '').toString().trim();
const composer = document.getElementById('composer');
const accessDenied = document.getElementById('accessDenied');
const postText = document.getElementById('postText');
const imageUrl = document.getElementById('imageUrl');
const imageFile = document.getElementById('imageFile');
const publishBtn = document.getElementById('publishBtn');
const pickPhotoBtn = document.getElementById('pickPhotoBtn');
const wordLimitWarning = document.getElementById('wordLimitWarning');
const createPollBtn = document.getElementById('createPollBtn');
const pollModal = document.getElementById('pollModal');
const pollForm = document.getElementById('pollForm');
const pollQuestion = document.getElementById('pollQuestion');
const pollOptionsList = document.getElementById('pollOptionsList');
const addPollOptionBtn = document.getElementById('addPollOptionBtn');
const cancelPollBtn = document.getElementById('cancelPollBtn');
const pollsStorageKey = 'schoolPolls';

function loadDarkMode() {
    document.body.classList.toggle('dark-mode', localStorage.getItem('schoolDarkMode') === 'true');
}

function readPosts() {
    try {
        const parsed = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
        return [];
    }
}

function savePosts(posts) {
    localStorage.setItem(storageKey, JSON.stringify(posts));
}

function resetForm() {
    postText.value = '';
    imageUrl.value = '';
    imageFile.value = '';
}

function getWordCount(value) {
    const trimmed = value.trim();
    return trimmed ? trimmed.split(/\s+/).length : 0;
}

function updateWordLimit() {
    const count = getWordCount(postText.value);
    const overLimit = count > 240;
    wordLimitWarning.classList.toggle('visible', overLimit);
    postText.classList.toggle('over-limit', overLimit);
    wordLimitWarning.textContent = overLimit
        ? `This post is ${count - 240} word${count - 240 === 1 ? '' : 's'} over the 240-word limit.`
        : '';
    publishBtn.disabled = overLimit;
    publishBtn.style.opacity = overLimit ? '0.55' : '1';
}

function publishPost() {
    if (!isAdmin) return;

    const text = postText.value.trim();
    const file = imageFile.files[0];
    const pastedImage = imageUrl.value.trim();
    if (getWordCount(text) > 240) {
        updateWordLimit();
        postText.focus();
        return;
    }
    if (!text && !file && !pastedImage) {
        alert('Please add a statement, image, or both.');
        postText.focus();
        return;
    }

    const post = {
        id: Date.now().toString(),
        author: 'Administrator',
        authorEmail: userEmail,
        time: 'Just now',
        createdAt: new Date().toISOString(),
        text,
        image: pastedImage,
        schoolName: currentSchool
    };

    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            post.image = event.target.result;
            savePosts([post, ...readPosts()]);
            window.location.href = 'admin-feed.html';
        };
        reader.readAsDataURL(file);
        return;
    }

    savePosts([post, ...readPosts()]);
    window.location.href = 'admin-feed.html';
}

function readPolls() {
    try {
        const parsed = JSON.parse(localStorage.getItem(pollsStorageKey) || '[]');
        return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
        return [];
    }
}

function savePolls(polls) {
    localStorage.setItem(pollsStorageKey, JSON.stringify(polls));
}

function updateRemoveButtons() {
    const rows = pollOptionsList.querySelectorAll('.poll-option-row');
    rows.forEach((row) => {
        row.querySelector('.remove-option').hidden = rows.length <= 2;
    });
}

function addPollOption() {
    const row = document.createElement('div');
    row.className = 'poll-option-row';
    const index = pollOptionsList.children.length + 1;
    row.innerHTML = `<input class="poll-option-input" type="text" maxlength="100" placeholder="Option ${index}"><button class="remove-option" type="button" aria-label="Remove option">×</button>`;
    row.querySelector('.remove-option').addEventListener('click', () => {
        row.remove();
        updateRemoveButtons();
    });
    pollOptionsList.appendChild(row);
    updateRemoveButtons();
}

function closePollModal() {
    pollModal.classList.remove('open');
}

function createPoll(event) {
    event.preventDefault();
    const question = pollQuestion.value.trim();
    const options = [...pollOptionsList.querySelectorAll('.poll-option-input')]
        .map((input) => input.value.trim()).filter(Boolean);
    if (!question || options.length < 2) {
        alert('Please enter a question and at least 2 options.');
        return;
    }
    savePolls([{
        id: `poll_${Date.now()}`,
        question,
        options: options.map((text) => ({ text, votes: [] })),
        createdBy: 'Administrator',
        createdByEmail: userEmail,
        schoolName: currentSchool,
        createdAt: new Date().toISOString(),
        isActive: true
    }, ...readPolls()]);
    window.location.href = 'admin-feed.html';
}

function init() {
    loadDarkMode();
    if (!isAdmin) {
        accessDenied.style.display = 'block';
        window.setTimeout(() => { window.location.href = 'admin-feed.html'; }, 900);
        return;
    }

    composer.hidden = false;
    pickPhotoBtn.addEventListener('click', () => imageFile.click());
    imageFile.addEventListener('change', () => {
        if (imageFile.files[0]) imageUrl.value = imageFile.files[0].name;
    });
    postText.addEventListener('input', updateWordLimit);
    publishBtn.addEventListener('click', publishPost);
    createPollBtn.addEventListener('click', () => {
        pollModal.classList.add('open');
        pollQuestion.focus();
    });
    addPollOptionBtn.addEventListener('click', addPollOption);
    cancelPollBtn.addEventListener('click', closePollModal);
    pollForm.addEventListener('submit', createPoll);
    pollModal.addEventListener('click', (event) => {
        if (event.target === pollModal) closePollModal();
    });
    updateRemoveButtons();
    postText.focus();
}

init();
</script>
</body>
</html>
