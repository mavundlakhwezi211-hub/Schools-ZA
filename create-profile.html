<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Profile</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-feature-settings: "liga" 1;
}

body{
    background:#1c0e9c;
    color:#173b5e;
    min-height:100vh;
    overflow-x:hidden;
}

.welcome-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg, #173b5e, #0d2944);
}

@media (max-width: 640px){
    .welcome-page,
    .form-page{
        padding:14px;
    }

    .welcome-card,
    .container{
        padding:24px;
        border-radius:16px;
    }

    .welcome-card h1{
        font-size:26px;
    }

    .start-btn,
    .submit-btn{
        width:100%;
        text-align:center;
    }

    .search-box{
        flex-direction:column;
    }

    .profile-stats{
        grid-template-columns:1fr;
    }
    .profile-card h2{font-size:18px;}
    .result-actions{flex-direction:column;}
    .result-actions .submit-btn{width:100%;}
    .input-row{flex-direction:column;}
    .child-row{flex-wrap:wrap;}
    .child-row input{min-width:0;}
    .summary-panel{padding:16px;}
}

@media (max-width: 480px){
    .welcome-page,
    .form-page{padding:12px;}
    .welcome-card,.container{padding:24px;border-radius:14px;}
    .welcome-card h1{font-size:28px;}
    .welcome-card p{font-size:17px;}
    .hero-illustration{padding:8px;max-width:300px;}
    .container h1{font-size:28px;}
    .subtitle{font-size:17px;}
    .pin-input-wrapper input{padding-right:52px;}
    .pin-toggle{font-size:22px;}
    .stat-pill{padding:12px 14px;}
    .activity-item{gap:10px;}
    .profile-card{padding:18px;}
    .profile-card-top{gap:12px;}
    .avatar{width:52px;height:52px;}
    input,select{padding:16px;font-size:17px;}
    label{font-size:16px;}
    .submit-btn{padding:18px;font-size:19px;}
}

@media (max-width: 400px){
    .welcome-page,
    .form-page{padding:10px;}
    .welcome-card,.container{padding:20px;border-radius:12px;}
    .welcome-card h1{font-size:26px;}
    .welcome-card p{font-size:16px;line-height:1.5;}
    .hero-illustration{padding:6px;max-width:260px;}
    .start-btn{padding:16px 22px;font-size:18px;}
    .container h1{font-size:26px;}
    .subtitle{font-size:16px;margin-bottom:20px;}
    .input-group{margin-bottom:16px;}
    input,select{padding:15px 14px;font-size:17px;border-radius:10px;}
    label{font-size:16px;margin-bottom:6px;}
    .search-box{gap:8px;}
    .search-box input{font-size:17px;}
    .school-select{min-height:170px;}
    .submit-btn{padding:17px;font-size:19px;margin-top:16px;border-radius:10px;}
    .summary-panel{padding:16px;gap:12px;}
    .profile-card{padding:16px;border-radius:14px;}
    .profile-card h2{font-size:20px;}
    .profile-card .meta{font-size:15px;}
    .activity-feed{padding:16px;border-radius:14px;}
    .activity-title{font-size:17px;}
    .feed-badge{font-size:13px;padding:6px 10px;}
    .activity-icon{width:38px;height:38px;font-size:16px;}
    .activity-meta{font-size:14px;}
    .result-actions{gap:8px;}
    .result-actions .submit-btn{min-width:0;padding:16px;font-size:17px;}
    .child-row input{font-size:17px;padding:13px;}
    .add-child-btn{padding:12px;font-size:15px;}
    .remove-child-btn{width:46px;height:46px;font-size:19px;}
    .no-result-msg{font-size:15px;padding:12px;}
}

@media (max-width: 360px){
    .welcome-page,
    .form-page{padding:8px;}
    .welcome-card,.container{padding:18px;border-radius:10px;}
    .welcome-card h1{font-size:24px;}
    .welcome-card p{font-size:15px;}
    .hero-illustration{max-width:220px;margin:12px auto 16px;}
    .start-btn{padding:14px 20px;font-size:17px;}
    .container h1{font-size:24px;}
    .subtitle{font-size:15px;margin-bottom:16px;}
    input,select{padding:14px 12px;font-size:16px;border-radius:8px;}
    label{font-size:15px;}
    .submit-btn{padding:16px;font-size:18px;}
    .stat-pill strong{font-size:14px;}
    .profile-stats{gap:6px;}
}

.welcome-card{
    background:rgba(255,255,255,0.95);
    color:#173b5e;
    width:100%;
    max-width:560px;
    padding:35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
}

.welcome-card h1{
    margin-bottom:10px;
    font-size:32px;
}

.welcome-card p{
    margin-bottom:18px;
    color:#666;
    line-height:1.6;
}

.hero-illustration{
    margin:18px auto 22px;
    width:100%;
    max-width:320px;
    padding:12px;
    border-radius:16px;
    background:linear-gradient(135deg, #f8fbff, #dceeff);
    border:2px solid #cfe3f7;
}

.start-btn{
    display:inline-block;
    background:#173b5e;
    color:#fff;
    padding:14px 24px;
    border-radius:10px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    font-family:Georgia, 'Times New Roman', Times, serif;
}

.start-btn:hover{
    background:#0f2a45;
}

.form-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#f4f6f9;
}

.container{
    background:#fff;
    width:100%;
    max-width:450px;
    min-width:0; /* allow the flex item to shrink below the school <select>'s intrinsic (longest option) width on mobile */
    padding:40px 30px;
    border-radius:16px;
    box-shadow:0 4px 24px rgba(0,0,0,0.04);
    color:#333;
    border:1px solid #e2e8f0;
}

h1{
    text-align:center;
    color:#0d3b66;
    margin-bottom:8px;
    font-size:28px;
    font-weight:600;
}

.subtitle{
    text-align:center;
    color:#7f8c8d;
    margin-bottom:30px;
    font-size:15px;
}

.input-group{
    margin-bottom:16px;
}

input,select{
    width:100%;
    padding:16px;
    border:1px solid #e2e8f0;
    border-radius:12px;
    font-size:16px; /* 16px minimum prevents mobile browsers zooming in when a field is focused */
    background:#fff;
    color:#4a5568;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus,select:focus{
    outline:none;
    border-color:#173b5e;
    box-shadow:0 0 0 3px rgba(23,59,94,0.12);
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    font-size:15px;
    color:#173b5e;
}

#create-profile label,
#create-profile #nameHint,
#create-profile .email-hint,
#create-profile #emailHint,
#create-profile .phone-hint{
    display:none;
}

.input-group-stacked{
    border:1px solid #e2e8f0;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.02);
}

.input-group-stacked input{
    border:0;
    border-radius:0;
}

.input-group-stacked input:not(:last-child){
    border-bottom:1px solid #e2e8f0;
}

.field-container{
    position:relative;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.02);
}

.field-container::after{
    content:'›';
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%) rotate(90deg);
    font-size:20px;
    color:#a0aec0;
    pointer-events:none;
}

.field-container select{
    appearance:none;
}

.selected-school-field{
    position:relative;
    margin-bottom:16px;
}

.selected-school-field input{
    cursor:pointer;
    padding-right:48px;
}

.selected-school-field::after{
    content:'⌕';
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    color:#a0aec0;
    pointer-events:none;
    font-size:22px;
}

.selected-school-field input:focus{
    outline:none;
    border-color:#0d3b66;
    box-shadow:0 0 0 3px rgba(13,59,102,0.12);
}

.search-box{
    display:flex;
    gap:0;
    margin-bottom:30px;
    border:1px solid #e2e8f0;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.02);
}

.search-box input{
    flex:1;
    border:0;
    border-radius:0;
}

.school-select{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:1px solid rgba(23,59,94,0.15);
    border-radius:12px;
    min-height:180px;
    background:rgba(255,255,255,0.9);
    display:none;
}

.no-result-msg{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:rgba(255,240,246,0.9);
    color:#a33b65;
    border:1px solid rgba(163,59,101,0.18);
    display:none;
    font-size:14px;
}

.submit-btn{
    width:100%;
    background:#0d3b66;
    color:#fff;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    margin-top:0;
    font-weight:500;
    box-shadow:none;
}

.submit-btn:hover{
    background:#0f2a45;
}

/* Conditional fields styling */
.conditional-field{
    display:none;
}

.conditional-field.visible{
    display:block;
}

.conditional-field .input-group{
    margin-bottom:12px;
}

.children-list{
    display:grid;
    gap:8px;
}

.child-row{
    display:flex;
    gap:8px;
    align-items:center;
}

.child-row input{
    flex:1;
}

.remove-child-btn{
    width:38px;
    height:38px;
    border:none;
    border-radius:10px;
    background:#fff1f1;
    color:#b42318;
    font-size:18px;
    cursor:pointer;
    display:grid;
    place-items:center;
    flex-shrink:0;
    border:1px solid rgba(180,35,24,0.16);
    font-family:Georgia, 'Times New Roman', Times, serif;
}

.remove-child-btn:hover{
    background:#ffe8e8;
}

.add-child-btn{
    background:transparent;
    border:1px dashed rgba(23,59,94,0.25);
    border-radius:10px;
    padding:8px;
    color:#173b5e;
    font-size:14px;
    cursor:pointer;
    width:100%;
    font-weight:600;
    font-family:Georgia, 'Times New Roman', Times, serif;
}

.add-child-btn:hover{
    background:rgba(23,59,94,0.04);
}

.pin-input-wrapper{
    position:relative;
}

.pin-input-wrapper input{
    padding-right:50px;
}

.pin-toggle{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:transparent;
    border:none;
    cursor:pointer;
    font-size:18px;
    color:#5d6f80;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CSS-only open eye icon */
.eye-container{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100px;
    height:100px;
}

.eye-shape{
    position:relative;
    width:80px;
    height:80px; /* square so the 45deg rotation puts the eye points exactly horizontal */
    border:5px solid black;
    border-radius:80% 0;
    transform:rotate(45deg);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.iris{
    width:32px;
    height:32px;
    border:4px solid black;
    border-radius:50%;
    transform:rotate(-45deg); /* Counter-rotate to stay upright */
    display:flex;
    justify-content:center;
    align-items:center;
}

.pupil{
    width:14px;
    height:14px;
    background-color:black;
    border-radius:50%;
}

/* Scale the CSS eye to icon size inside the PIN toggle so the input layout is not broken.
   Shape is a rotated square, so its visible width = side x sqrt(2); 0.72em side -> ~1em wide eye, matching the closed-eye SVG (1em). */
.pin-toggle .eye-container{
    width:1.1em;
    height:1.1em;
}

.pin-toggle .eye-shape{
    width:0.72em;
    height:0.72em;
    border-width:0.05em;
}

.pin-toggle .iris{
    width:0.33em;
    height:0.33em;
    border-width:0.04em;
}

.pin-toggle .pupil{
    width:0.145em;
    height:0.145em;
}

.phone-hint{
    font-size:12px;
    color:#5d6f80;
    margin-top:6px;
}

.phone-hint.error{
    color:#b42318;
}
.phone-hint.success{
    color:#2e7d32;
}
</style>
</head>
<body>
<section class="form-page" id="create-profile">
    <div class="container">
        <h1>Apply</h1>
        <p class="subtitle">Fill out the form to get started</p>

        <form id="profileForm" novalidate>
            <div class="input-group-stacked">
                <input type="text" id="fullNameInput" placeholder="Full Name" required>
                <input type="hidden" id="firstName" name="firstName">
                <input type="hidden" id="lastName" name="lastName">
                <input type="email" id="emailInput" name="email" placeholder="Email Address" required>
                <input type="tel" id="phoneInput" name="phone" placeholder="Phone Number (optional)">
            </div>

            <div class="field-container">
                <select id="roleSelect" name="role">
                    <option value="" disabled selected hidden>Select Role</option>
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Parent</option>
                    <option>Administrator</option>
                </select>
            </div>

            <!-- Student Grade Field (shown when Student is selected) -->
            <div class="conditional-field" id="gradeField">
                <div class="input-group">
                    <label>Grade / Standard</label>
                    <select id="gradeSelect" name="grade">
                        <option value="">Select Grade</option>
                        <option>Grade 8</option>
                        <option>Grade 9</option>
                        <option>Grade 10</option>
                        <option>Grade 11</option>
                        <option>Grade 12</option>
                    </select>
                </div>
            </div>

            <!-- Parent child setup note (shown when Parent is selected) -->
            <div class="conditional-field" id="childrenField">
                <div class="input-group">
                    <label>Parent child setup</label>
                    <p class="phone-hint">Once your profile is created, you will be guided to add your child or children for the school learner list.</p>
                </div>
            </div>

            <!-- Administrator PIN Field (shown when Administrator is selected) -->
            <div class="conditional-field" id="adminPinField">
                <div class="input-group">
                    <label>Administrator PIN</label>
                    <div class="pin-input-wrapper">
                        <input type="password" id="adminPin" name="adminPin" placeholder="Enter admin PIN to proceed" inputmode="numeric" pattern="[0-9]*" maxlength="4">
                        <button type="button" class="pin-toggle" id="pinToggle" title="Toggle PIN visibility"><div class="eye-container"><div class="eye-shape"><div class="iris"><div class="pupil"></div></div></div></div></button>
                    </div>
                    <p style="font-size:12px;color:#5d6f80;margin-top:6px;">You need a valid admin PIN to register as an administrator.</p>
                </div>
            </div>

            <div class="field-container">
                <select id="provinceSelect" name="province">
                    <option value="" disabled selected hidden>Select Province</option>
                    <option>GAUTENG</option>
                    <option>KwaZulu-Natal</option>
                    <option>Western Cape</option>
                    <option>Eastern Cape</option>
                    <option>Limpopo</option>
                    <option>Mpumalanga</option>
                    <option>North West</option>
                    <option>Free State</option>
                    <option>Northern Cape</option>
                </select>
            </div>

            <div class="selected-school-field">
                <input type="text" id="schoolPicker" placeholder="Select School" readonly>
            </div>

            <div class="search-box">
                <input type="search" id="schoolSearch" name="schoolSearch" placeholder="Search school name" autocomplete="off" spellcheck="false">
            </div>

            <input type="hidden" id="selectedSchool" name="selectedSchool">
            <select id="schoolSelect" class="school-select" size="8">
                <option value="">Select a school</option>
                <option>Acornhoek Secondary</option>
                <option>Alexandra High School</option>
                <option>Belhar High School</option>
                <option>Boitshepi Secondary School</option>
                <option>Casteel Secondary</option>
                <option>Curro Durbanville</option>
                <option>Durban Girls' College</option>
                <option>Dwarsloop Secondary</option>
                <option>East London Secondary School</option>
                <option>Glenwood High School</option>
                <option>Hazyview Comprehensive School</option>
                <option>Hoxani Secondary</option>
                <option>Jeppe High School for Boys</option>
                <option>Khanyisani Secondary School</option>
                <option>King Edward VII School</option>
                <option>KwaMashu Secondary School</option>
                <option>Lekazi Secondary</option>
                <option>Mapulaneng Secondary</option>
                <option>Maritzburg College</option>
                <option>Masoyi Secondary</option>
                <option>Matsulu Secondary</option>
                <option>Maviljan Secondary</option>
                <option>Mkhuhlu East Secondary</option>
                <option>Mkhuhlu Secondary</option>
                <option>Mshadza Secondary</option>
                <option>Northwood School</option>
                <option>Phumelela Secondary</option>
                <option>Pretoria Boys High School</option>
                <option>Rondebosch Boys' High School</option>
                <option>Shishila Secondary</option>
                <option>Sibuyile Secondary</option>
                <option>Sitintile Secondary</option>
                <option>Siyabuswa Secondary</option>
                <option>St Stithians College</option>
                <option>Thulamahashe East Secondary</option>
                <option>Thulamahashe Secondary</option>
                <option>Witbank High School</option>
                <option>Zolani High School</option>
            </select>

            <div id="noResultMsg" class="no-result-msg">Your school is not available 😢</div>

            <button type="submit" class="submit-btn" id="submitBtn">Create Profile</button>
        </form>
    </div>
</section>

<script>
    const form = document.getElementById('profileForm');
    const schoolSearchInput = document.getElementById('schoolSearch');
    const schoolSelect = document.getElementById('schoolSelect');
    const selectedSchoolInput = document.getElementById('selectedSchool');
    const storageKey = 'schoolProfileData';
    const roleSelect = document.getElementById('roleSelect');
    const gradeField = document.getElementById('gradeField');
    const childrenField = document.getElementById('childrenField');
    const adminPinField = document.getElementById('adminPinField');
    const adminPin = document.getElementById('adminPin');
    const pinToggle = document.getElementById('pinToggle');
    const fullNameInput = document.getElementById('fullNameInput');
    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const schoolPicker = document.getElementById('schoolPicker');
    const emailInput = document.getElementById('emailInput');
    const emailHint = document.getElementById('emailHint');
    const phoneInput = document.getElementById('phoneInput');
    const phoneHint = document.getElementById('phoneHint');
    const submitBtn = document.getElementById('submitBtn');

    schoolPicker.addEventListener('click', () => { schoolSearchInput.focus(); filterSchools(); });

    // Name Validation - only letters and spaces allowed
    function isValidName(name) {
        if (!name) return false;
        return /^[A-Za-z\s'-]+$/.test(name);
    }

    function validateName() {
        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        const hint = document.getElementById('nameHint');
        if (!firstName || !lastName) {
            hint.textContent = 'Please enter your name and surname (letters only, no numbers)';
            hint.className = 'phone-hint';
            return false;
        }
        if (isValidName(firstName) && isValidName(lastName)) {
            hint.textContent = 'Valid name ✓';
            hint.className = 'phone-hint success';
            return true;
        } else {
            hint.textContent = 'Name and surname must only contain letters and spaces (no numbers or special characters).';
            hint.className = 'phone-hint error';
            return false;
        }
    }

    function syncFullName() {
        const nameParts = fullNameInput.value.trim().split(/\s+/).filter(Boolean);
        firstNameInput.value = nameParts.shift() || '';
        lastNameInput.value = nameParts.join(' ');
    }

    fullNameInput.addEventListener('input', syncFullName);
    fullNameInput.addEventListener('blur', syncFullName);

    firstNameInput.addEventListener('input', validateName);
    firstNameInput.addEventListener('blur', validateName);
    lastNameInput.addEventListener('input', validateName);
    lastNameInput.addEventListener('blur', validateName);

    // Email Validation
    function isValidEmail(email) {
        if (!email) return false;
        // Standard email format regex
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function validateEmail() {
        const email = emailInput.value.trim();
        if (!email) {
            emailHint.textContent = 'Please enter a valid email address (e.g. name@example.com)';
            emailHint.className = 'phone-hint';
            return false;
        }
        if (isValidEmail(email)) {
            emailHint.textContent = 'Valid email address ✓';
            emailHint.className = 'phone-hint success';
            return true;
        } else {
            emailHint.textContent = 'Invalid email format. Please use a format like name@example.com';
            emailHint.className = 'phone-hint error';
            return false;
        }
    }

    emailInput.addEventListener('input', validateEmail);
    emailInput.addEventListener('blur', validateEmail);

    // South African Phone Number Validation
    function isValidSaPhone(phone) {
        if (!phone) return false;
        const cleaned = phone.replace(/[^\d+]/g, '');
        return /^(\+27\d{9}|0\d{9})$/.test(cleaned);
    }

    function formatSaPhone(phone) {
        if (!phone) return '';
        let cleaned = phone.replace(/[^\d+]/g, '');
        if (/^0\d{9}$/.test(cleaned)) {
            return cleaned.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1 $2 $3');
        }
        if (/^\+27\d{9}$/.test(cleaned)) {
            return cleaned.replace(/^(\+27)(\d{2})(\d{3})(\d{4})$/, '$1 $2 $3 $4');
        }
        return phone;
    }

    function validatePhone() {
        const phone = phoneInput.value.trim();
        if (!phone) {
            phoneHint.textContent = '';
            phoneHint.className = 'phone-hint';
            return true;
        }
        if (isValidSaPhone(phone)) {
            const formatted = formatSaPhone(phone);
            phoneHint.textContent = 'Valid South African number: ' + formatted;
            phoneHint.className = 'phone-hint success';
            return true;
        } else {
            phoneHint.textContent = 'Invalid South African cell phone number. It must start with 0 (10 digits) or +27 (11 digits after +27).';
            phoneHint.className = 'phone-hint error';
            return false;
        }
    }

    phoneInput.addEventListener('input', validatePhone);
    phoneInput.addEventListener('blur', validatePhone);

    // Role-based field visibility
    function updateConditionalFields() {
        const role = (roleSelect.value || '').trim().toLowerCase();

        // Student: show grade field
        gradeField.classList.toggle('visible', role === 'student');

        // Parent: show children names field
        childrenField.classList.toggle('visible', role === 'parent');

        // Administrator: show admin PIN field
        adminPinField.classList.toggle('visible', role === 'administrator' || role === 'admin');
    }

    roleSelect.addEventListener('change', updateConditionalFields);

    // Toggle PIN visibility
    const eyeIcon = '<div class="eye-container"><div class="eye-shape"><div class="iris"><div class="pupil"></div></div></div></div>';
    const eyeOffIcon = '<svg width="1em" height="1em" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 35 C 30 15, 70 15, 85 35" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M5 45 C 20 75, 80 75, 95 45" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="12" y1="53" x2="3" y2="65" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="30" y1="67" x2="23" y2="82" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="71" x2="50" y2="89" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="67" x2="77" y2="82" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="88" y1="53" x2="97" y2="65" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>';

    pinToggle.addEventListener('click', function() {
        const type = adminPin.getAttribute('type') === 'password' ? 'text' : 'password';
        adminPin.setAttribute('type', type);
        this.innerHTML = type === 'password' ? eyeIcon : eyeOffIcon;
    });

    function collectRoleData(data) {
        const role = (data.role || '').trim().toLowerCase();
        if (role === 'student') {
            data.grade = document.getElementById('gradeSelect').value;
        } else if (role === 'parent') {
            data.children = [];
            data.childSetupPending = true;
        } else if (role === 'administrator' || role === 'admin') {
            data.adminPin = adminPin.value.trim();
        }
        return data;
    }

    function buildProfileData() {
        syncFullName();
        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        const data = {
            firstName,
            lastName,
            fullName: [firstName, lastName].filter(Boolean).join(' '),
            role: roleSelect.value,
            province: document.getElementById('provinceSelect').value,
            schoolName: selectedSchoolInput.value,
            schoolSearch: schoolSearchInput.value,
            email: document.getElementById('emailInput').value.trim(),
            phone: document.getElementById('phoneInput').value.trim()
        };
        return collectRoleData(data);
    }

    // Validation function
    function validateForm(data) {
        // Required fields always
        if (!data.firstName || !data.lastName) {
            alert('Please enter your name and surname.');
            return false;
        }
        if (!isValidName(data.firstName) || !isValidName(data.lastName)) {
            alert('Name and surname must only contain letters and spaces (no numbers or special characters).');
            return false;
        }
        if (!data.role) {
            alert('Please select a role.');
            return false;
        }
        if (!data.province) {
            alert('Please select a province.');
            return false;
        }
        if (!data.email) {
            alert('Please enter your email address.');
            return false;
        }
        if (!isValidEmail(data.email)) {
            alert('Please enter a valid email address (e.g. name@example.com).');
            return false;
        }
        if (!data.schoolName && !data.schoolSearch) {
            alert('Please select a school.');
            return false;
        }
        // Validate the optional South African phone number when provided.
        if (data.phone && !isValidSaPhone(data.phone)) {
            alert('Please enter a valid South African cell phone number. It must start with 0 (10 digits) or +27 (11 digits after +27).');
            return false;
        }

        const role = (data.role || '').trim().toLowerCase();

        // Student validation
        if (role === 'student') {
            if (!data.grade) {
                alert('Please select your grade.');
                return false;
            }
        }

        // Administrator PIN validation
        if (role === 'administrator' || role === 'admin') {
            const pin = data.adminPin;
            if (!pin) {
                alert('Please enter the administrator PIN.');
                return false;
            }
            if (pin !== '1111') {
                alert('Invalid administrator PIN. Please check and try again.');
                return false;
            }
        }

        return true;
    }

    function saveFormData() {
        const data = buildProfileData();
        // If role is not admin, strip the PIN from saved data for privacy
        const role = (data.role || '').trim().toLowerCase();
        if (role !== 'administrator' && role !== 'admin') {
            delete data.adminPin;
        }
        localStorage.setItem(storageKey, JSON.stringify(data));
        return data;
    }

    const usersRegistryKey = 'schoolUsersRegistry';

    function normalizeText(value) {
        return (value || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function getDisplayFullName(data) {
        return data.fullName || [data.firstName || '', data.lastName || ''].filter(Boolean).join(' ');
    }

    function findMatchingUserIndex(registry, data) {
        const role = (data.role || '').trim().toLowerCase();
        const email = (data.email || '').trim().toLowerCase();
        const fullName = normalizeText(getDisplayFullName(data));
        const schoolName = normalizeText(data.schoolName || data.schoolSearch || '');
        const grade = normalizeText(data.grade || '');

        return registry.findIndex((user) => {
            const userEmail = (user.email || '').trim().toLowerCase();
            if (email && userEmail && userEmail === email) {
                return true;
            }

            const userFullName = normalizeText(user.fullName || getDisplayFullName(user));
            const userSchool = normalizeText(user.schoolName || '');
            const userGrade = normalizeText(user.grade || '');

            const sameName = Boolean(fullName && userFullName && fullName === userFullName);
            const sameSchool = Boolean(schoolName && userSchool && schoolName === userSchool);
            const sameGrade = !grade || !userGrade || grade === userGrade;

            if (role === 'student' && sameName && sameSchool && grade && sameGrade) {
                return true;
            }

            if (role === 'parent' && sameName && sameSchool) {
                return true;
            }

            return false;
        });
    }

    function upsertUserRegistry(data) {
        const email = (data.email || '').trim().toLowerCase();
        if (!email) return;

        let registry = [];
        try {
            const saved = localStorage.getItem(usersRegistryKey);
            registry = saved ? JSON.parse(saved) : [];
            if (!Array.isArray(registry)) registry = [];
        } catch (error) {
            console.log('Unable to read users registry', error);
            registry = [];
        }

        const entry = {
            id: email,
            firstName: data.firstName || '',
            lastName: data.lastName || '',
            fullName: getDisplayFullName(data),
            role: (data.role || '').trim(),
            grade: data.grade || '',
            children: data.children || [],
            province: data.province,
            schoolName: data.schoolName || data.schoolSearch || '',
            email: data.email,
            phone: data.phone
        };

        const existingIndex = findMatchingUserIndex(registry, data);
        if (existingIndex >= 0) {
            const existing = registry[existingIndex];
            registry[existingIndex] = {
                ...existing,
                ...entry,
                id: existing.id || entry.id,
                fullName: entry.fullName || existing.fullName || '',
                firstName: entry.firstName || existing.firstName || '',
                lastName: entry.lastName || existing.lastName || '',
                role: entry.role || existing.role || '',
                grade: entry.grade || existing.grade || '',
                schoolName: entry.schoolName || existing.schoolName || '',
                email: entry.email || existing.email || '',
                phone: entry.phone || existing.phone || '',
                province: entry.province || existing.province || ''
            };
        } else {
            registry.push(entry);
        }

        localStorage.setItem(usersRegistryKey, JSON.stringify(registry));
    }

    function loadSavedData() {
        const saved = localStorage.getItem(storageKey);
        if (!saved) return;

        try {
            const data = JSON.parse(saved);
            const splitName = data.fullName ? data.fullName.trim().split(/\s+/) : [];
            firstNameInput.value = data.firstName || (splitName[0] || '');
            lastNameInput.value = data.lastName || (splitName.slice(1).join(' ') || '');
            fullNameInput.value = data.fullName || [firstNameInput.value, lastNameInput.value].filter(Boolean).join(' ');
            roleSelect.value = data.role || '';
            document.getElementById('provinceSelect').value = data.province || 'GAUTENG';
            selectedSchoolInput.value = data.schoolName || '';
            schoolPicker.value = data.schoolName || '';
            schoolSearchInput.value = data.schoolSearch || data.schoolName || '';
            document.getElementById('emailInput').value = data.email || '';
            document.getElementById('phoneInput').value = data.phone || '';

            // Load conditional fields
            if (data.grade) {
                document.getElementById('gradeSelect').value = data.grade;
            }

            if (data.adminPin && (data.role || '').trim().toLowerCase() === 'administrator') {
                adminPin.value = data.adminPin;
            }

            // Update visibility
            updateConditionalFields();

            if (data.schoolName) {
                schoolSelect.style.display = 'none';
            }
            validateName();
            validatePhone();
        } catch (error) {
            console.log('Unable to load saved profile data', error);
        }
    }

    function clearSchoolSearch() {
        schoolSearchInput.value = '';
        schoolSelect.value = '';
        schoolSelect.style.display = 'none';
        selectedSchoolInput.value = '';
        schoolPicker.value = '';
        const noResultMsg = document.getElementById('noResultMsg');
        if (noResultMsg) noResultMsg.style.display = 'none';
        saveFormData();
    }

    function filterSchools() {
        const query = schoolSearchInput.value.trim().toLowerCase();
        const noResultMsg = document.getElementById('noResultMsg');
        let matchCount = 0;
        let firstMatchText = '';

        if (!query) {
            clearSchoolSearch();
            return;
        }

        // Require at least 4 letters before auto-completing the school name
        if (query.length < 4) {
            schoolSelect.style.display = 'none';
            selectedSchoolInput.value = '';
            schoolPicker.value = '';
            noResultMsg.style.display = 'none';
            return;
        }

        schoolSelect.style.display = 'none';

        Array.from(schoolSelect.options).forEach((option) => {
            if (option.value === '') {
                option.hidden = true;
                return;
            }

            const text = option.text.toLowerCase();
            const shouldShow = text.includes(query);
            option.hidden = !shouldShow;

            if (shouldShow) {
                matchCount++;
                if (matchCount === 1) {
                    firstMatchText = option.text;
                }
            }
        });

        if (matchCount === 0) {
            schoolSelect.value = '';
            selectedSchoolInput.value = '';
            noResultMsg.style.display = 'block';
            schoolSelect.style.display = 'none';
        } else {
            // Auto-select the first match, fill the search input with the full
            // school name, hide the dropdown, and save — no extra click needed.
            schoolSelect.value = firstMatchText;
            selectedSchoolInput.value = firstMatchText;
            schoolPicker.value = firstMatchText;
            schoolSearchInput.value = firstMatchText;
            noResultMsg.style.display = 'none';
            schoolSelect.style.display = 'none';
        }

        saveFormData();
    }

    schoolSelect.addEventListener('change', () => {
        const selectedSchoolName = schoolSelect.value ? schoolSelect.options[schoolSelect.selectedIndex].text : '';
        selectedSchoolInput.value = selectedSchoolName;
        schoolPicker.value = selectedSchoolName;
        schoolSearchInput.value = selectedSchoolName;
        schoolSelect.style.display = 'none';
        saveFormData();
    });

    form.addEventListener('submit', (event) => {
        event.preventDefault();

        const data = buildProfileData();

        if (!validateForm(data)) {
            return;
        }

        saveFormData();
        upsertUserRegistry(data);

        if ((data.role || '').trim().toLowerCase() === 'parent') {
            window.location.replace('parent-children.html');
        } else {
            window.location.replace('profile-success.html');
        }
    });

    ['input', 'change'].forEach((eventType) => {
        form.addEventListener(eventType, function(e) {
            // Only auto-save for non-conditional fields to avoid premature validation
            const id = e.target ? e.target.id : '';
            if (!['gradeSelect', 'adminPin'].includes(id)) {
                saveFormData();
            }
        });
    });

    schoolSearchInput.addEventListener('input', () => {
        if (schoolSearchInput.value.trim() === '') {
            clearSchoolSearch();
        } else {
            filterSchools();
        }
    });
    schoolSearchInput.addEventListener('search', clearSchoolSearch);
    schoolSearchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            filterSchools();
        }
    });

    loadSavedData();
</script>
</body>
