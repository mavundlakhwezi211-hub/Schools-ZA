<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-feature-settings: "liga" 1;
}

body{
    background:#1c0e9c;
    color:#173b5e;
    min-height:100vh;
    overflow-x:hidden;
}

.form-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#f4f6f9;
}

.container{
    background:#fff;
    width:100%;
    max-width:450px;
    padding:40px 30px;
    border-radius:16px;
    box-shadow:0 4px 24px rgba(0,0,0,0.04);
    color:#333;
    border:1px solid #e2e8f0;
}

h1{
    text-align:center;
    color:#0d3b66;
    margin-bottom:8px;
    font-size:28px;
    font-weight:600;
}

.subtitle{
    text-align:center;
    color:#7f8c8d;
    margin-bottom:30px;
    font-size:15px;
}

.input-group{
    margin-bottom:16px;
}

input{
    width:100%;
    padding:16px;
    border:1px solid #e2e8f0;
    border-radius:12px;
    font-size:15px;
    background:#fff;
    color:#4a5568;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus{
    outline:none;
    border-color:#173b5e;
    box-shadow:0 0 0 3px rgba(23,59,94,0.12);
}

.submit-btn{
    width:100%;
    background:#0d3b66;
    color:#fff;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    margin-top:0;
    font-weight:500;
    box-shadow:none;
}

.submit-btn:hover{
    background:#0f2a45;
}

.submit-btn.secondary{
    background:#eef2f6;
    color:#0d3b66;
    margin-top:10px;
}

.submit-btn.secondary:hover{
    background:#e2e8f0;
}

.phone-hint{
    font-size:12px;
    color:#5d6f80;
    margin-top:6px;
}

.phone-hint.error{
    color:#b42318;
}
.phone-hint.success{
    color:#2e7d32;
}

@media (max-width: 640px){
    .form-page{
        padding:14px;
    }
    .container{
        padding:24px;
        border-radius:16px;
    }
    .container h1{
        font-size:26px;
    }
    .subtitle{
        font-size:16px;
    }
    input{
        padding:16px;
        font-size:16px;
    }
    .phone-hint{
        font-size:13px;
    }
    .submit-btn{
        width:100%;
        text-align:center;
        padding:16px;
        font-size:18px;
        border-radius:12px;
    }
    .submit-btn.secondary{
        margin-top:10px;
    }
}

@media (max-width: 480px){
    .form-page{padding:10px;}
    .container{padding:20px;border-radius:14px;}
    .container h1{font-size:24px;}
    .subtitle{font-size:15px;}
    input{padding:14px;font-size:16px;border-radius:12px;}
    .phone-hint{font-size:13px;}
    .submit-btn{padding:16px;font-size:20px;border-radius:12px;}
}

@media (max-width: 400px){
    .form-page{padding:8px;}
    .container{padding:16px;border-radius:12px;}
    .container h1{font-size:22px;}
    .subtitle{font-size:14px;margin-bottom:18px;}
    .input-group{margin-bottom:14px;}
    input{padding:12px;font-size:16px;border-radius:10px;}
    .phone-hint{font-size:13px;}
    .submit-btn{padding:16px;font-size:18px;margin-top:16px;border-radius:10px;}
}

@media (max-width: 360px){
    .form-page{padding:6px;}
    .container{padding:14px;border-radius:10px;}
    .container h1{font-size:20px;}
    .subtitle{font-size:13px;margin-bottom:14px;}
    input{padding:10px;font-size:16px;border-radius:8px;}
    .submit-btn{padding:14px;font-size:18px;}
}</style>
</head>
<body>
<section class="form-page">
    <div class="container">
        <h1>Edit Your Profile</h1>
        <p class="subtitle">Edit your profile</p>

        <form id="profileForm" novalidate>
            <div class="input-group">
                <input type="email" id="emailInput" name="email" placeholder="Email Address" autocomplete="email" required>
                <div id="emailHint" class="phone-hint">Please enter a valid email address (e.g. name@example.com)</div>
            </div>

            <div class="input-group">
                <input type="tel" id="phoneInput" name="phone" placeholder="Phone Number (e.g. 0821234567 or +27821234567)" autocomplete="tel" required>
                <div id="phoneHint" class="phone-hint">Please enter a valid South African cell phone number (e.g. 082 123 4567 or +27 82 123 4567)</div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Save Changes</button>
            <button type="button" class="submit-btn secondary" id="cancelBtn">Cancel</button>
        </form>
    </div>
</section>

<script>
    const form = document.getElementById('profileForm');
    const emailInput = document.getElementById('emailInput');
    const emailHint = document.getElementById('emailHint');
    const phoneInput = document.getElementById('phoneInput');
    const phoneHint = document.getElementById('phoneHint');
    const cancelBtn = document.getElementById('cancelBtn');
    const storageKey = 'schoolProfileData';
    const usersRegistryKey = 'schoolUsersRegistry';
// ============================================================
    // EMAIL VALIDATION
    // ============================================================
    function isValidEmail(email) {
        if (!email) return false;
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function validateEmail() {
        const email = emailInput.value.trim();
        if (!email) {
            emailHint.textContent = 'Please enter a valid email address (e.g. name@example.com)';
            emailHint.className = 'phone-hint';
            return false;
        }
        if (isValidEmail(email)) {
            // Valid â€” don't show a success confirmation message
            emailHint.textContent = '';
            emailHint.className = 'phone-hint';
            return true;
        } else {
            emailHint.textContent = 'Invalid email format. Please use a format like name@example.com';
            emailHint.className = 'phone-hint error';
            return false;
        }
    }

    emailInput.addEventListener('input', validateEmail);
    emailInput.addEventListener('blur', validateEmail);

    // ============================================================
    // SOUTH AFRICAN PHONE NUMBER VALIDATION
    // ============================================================
    function isValidSaPhone(phone) {
        if (!phone) return false;
        const cleaned = phone.replace(/[^\d+]/g, '');
        return /^(\+27\d{9}|0\d{9})$/.test(cleaned);
    }

    function formatSaPhone(phone) {
        if (!phone) return '';
        let cleaned = phone.replace(/[^\d+]/g, '');
        if (/^0\d{9}$/.test(cleaned)) {
            return cleaned.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3');
        }
        if (/^\+27\d{9}$/.test(cleaned)) {
            return cleaned.replace(/(\+27)(\d{2})(\d{3})(\d{4})/, '$1 $2 $3 $4');
        }
        return phone;
    }

    function validatePhone() {
        const phone = phoneInput.value.trim();
        if (!phone) {
            phoneHint.textContent = 'Please enter a valid South African cell phone number (e.g. 082 123 4567 or +27 82 123 4567)';
            phoneHint.className = 'phone-hint';
            return false;
        }
        if (isValidSaPhone(phone)) {
            // Valid â€” don't show a success confirmation message
            phoneHint.textContent = '';
            phoneHint.className = 'phone-hint';
            return true;
        } else {
            phoneHint.textContent = 'Invalid South African cell phone number. It must start with 0 (10 digits) or +27 (11 digits after +27).';
            phoneHint.className = 'phone-hint error';
            return false;
        }
    }

    phoneInput.addEventListener('input', validatePhone);
    phoneInput.addEventListener('blur', validatePhone);
// ============================================================
    // LOAD SAVED DATA
    // ============================================================
    function loadSavedData() {
        const saved = localStorage.getItem(storageKey);
        if (!saved) {
            window.location.href = 'create-profile.html';
            return;
        }
        try {
            const data = JSON.parse(saved);
            emailInput.value = data.email || '';
            phoneInput.value = data.phone || '';
            validateEmail();
            validatePhone();
        } catch (error) {
            console.log('Unable to load saved profile data', error);
        }
    }

    // ============================================================
    // BUILD PROFILE DATA
    // ============================================================
    function buildProfileData() {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        saved.email = emailInput.value.trim();
        saved.phone = phoneInput.value.trim();
        return saved;
    }

    // ============================================================
    // VALIDATION
    // ============================================================
    function validateForm(data) {
        if (!data.email) {
            alert('Please enter your email address.');
            return false;
        }
        if (!isValidEmail(data.email)) {
            alert('Please enter a valid email address (e.g. name@example.com).');
            return false;
        }
        if (!data.phone) {
            alert('Please enter your phone number.');
            return false;
        }
        if (!isValidSaPhone(data.phone)) {
            alert('Please enter a valid South African cell phone number. It must start with 0 (10 digits) or +27 (11 digits after +27).');
            return false;
        }
        return true;
    }

    // ============================================================
    // SAVE & REGISTRY
    // ============================================================
    function upsertUserRegistry(data) {
        const email = (data.email || '').trim().toLowerCase();
        if (!email) return;

        let registry = [];
        try {
            const saved = localStorage.getItem(usersRegistryKey);
            registry = saved ? JSON.parse(saved) : [];
            if (!Array.isArray(registry)) registry = [];
        } catch (error) {
            console.log('Unable to read users registry', error);
            registry = [];
        }

        const entry = {
            id: email,
            firstName: data.firstName || '',
            lastName: data.lastName || '',
            fullName: data.fullName || [data.firstName || '', data.lastName || ''].filter(Boolean).join(' '),
            role: (data.role || '').trim(),
            grade: data.grade || '',
            children: data.children || [],
            province: data.province,
            schoolName: data.schoolName || data.schoolSearch || '',
            email: data.email,
            phone: data.phone
        };

        const existingIndex = registry.findIndex((user) => (user.email || '').trim().toLowerCase() === email);
        if (existingIndex >= 0) {
            registry[existingIndex] = entry;
        } else {
            registry.push(entry);
        }

        localStorage.setItem(usersRegistryKey, JSON.stringify(registry));
    }

    function saveFormData() {
        const data = buildProfileData();
        localStorage.setItem(storageKey, JSON.stringify(data));
        return data;
    }
// ============================================================
    // FORM SUBMIT
    // ============================================================
    form.addEventListener('submit', (event) => {
        event.preventDefault();

        const data = buildProfileData();

        if (!validateForm(data)) {
            return;
        }

        saveFormData();
        upsertUserRegistry(data);
        window.location.replace('profile-success.html');
    });

    // ============================================================
    // CANCEL BUTTON
    // ============================================================
    cancelBtn.addEventListener('click', function() {
        window.location.href = 'admin-feed.html';
    });

    // ============================================================
    // AUTO-SAVE
    // ============================================================
    ['input', 'change'].forEach((eventType) => {
        form.addEventListener(eventType, function(e) {
            saveFormData();
        });
    });

    // ============================================================
    // INIT
    // ============================================================
    loadSavedData();
</script>
</body>
</html>
