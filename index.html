<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-feature-settings: "liga" 1;
}

body{
    background:#f3f6fb;
    color:#173b5e;
    min-height:100vh;
    overflow-x:hidden;
}

html,
body{
    width:100%;
}

.welcome-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start; /* Content now hugs the top so the logo leads */
    padding:20px;
    background:#f3f6fb;
}

.welcome-card{
    background:transparent;
    color:#173b5e;
    width:min(100%, 760px);
    max-width:760px;
    padding:0;
    border-radius:0;
    text-align:center;
    box-shadow:none;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
}

@media (max-width: 640px){
    .welcome-page{
        padding:14px;
    }

    .welcome-card,
    .container{
        padding:24px;
        border-radius:16px;
    }

    .welcome-card{
        gap:12px;
    }

    .welcome-card h1{
        font-size:clamp(2rem, 8vw, 2.6rem);
    }

    .hero-illustration{
        width:min(100%, 300px);
        padding:12px;
    }

    .start-btn,
    .submit-btn{
        width:100%;
        text-align:center;
    }

    .search-box{
        flex-direction:column;
    }

    .profile-stats{
        grid-template-columns:1fr;
    }
    .profile-card h2{font-size:18px;}
    .result-actions{flex-direction:column;}
    .result-actions .submit-btn{width:100%;}
    .input-row{flex-direction:column;}
    .child-row{flex-wrap:wrap;}
    .child-row input{min-width:0;}
    .summary-panel{padding:16px;}
}

@media (max-width: 480px){
    .welcome-page{padding:10px;}
    .welcome-card,.container{padding:20px;border-radius:14px;}
    .welcome-card h1{font-size:clamp(1.8rem, 8vw, 2.2rem);}
    .welcome-card p{font-size:0.95rem;}
    .hero-illustration{padding:10px;max-width:270px; width:min(100%, 270px);}
    .container h1{font-size:22px;}
    .subtitle{font-size:14px;}
    .pin-input-wrapper input{padding-right:44px;}
    .pin-toggle{font-size:16px;}
    .stat-pill{padding:8px 10px;}
    .activity-item{gap:8px;}
    .profile-card{padding:16px;}
    .profile-card-top{gap:10px;}
    .avatar{width:48px;height:48px;}
    input,select{padding:12px;font-size:15px;}
    .submit-btn{padding:14px;font-size:18px;}
}

@media (max-width: 400px){
    .welcome-page{padding:8px;}
    .welcome-card,.container{padding:16px;border-radius:12px;}
    .welcome-card h1{font-size:clamp(1.7rem, 7.5vw, 2rem);}
    .welcome-card p{font-size:0.88rem;line-height:1.5;}
    .hero-illustration{padding:8px;max-width:220px; width:min(100%, 220px);}
    .start-btn{padding:12px 18px;font-size:16px;}
    .container h1{font-size:20px;}
    .subtitle{font-size:13px;margin-bottom:18px;}
    .input-group{margin-bottom:14px;}
    input,select{padding:10px 12px;font-size:14px;border-radius:10px;}
    label{font-size:13px;margin-bottom:6px;}
    .search-box{gap:8px;}
    .search-box input{font-size:14px;}
    .school-select{min-height:140px;}
    .submit-btn{padding:12px;font-size:17px;margin-top:16px;border-radius:10px;}
    .summary-panel{padding:14px;gap:12px;}
    .profile-card{padding:14px;border-radius:14px;}
    .profile-card h2{font-size:16px;}
    .profile-card .meta{font-size:13px;}
    .activity-feed{padding:14px;border-radius:14px;}
    .activity-title{font-size:15px;}
    .feed-badge{font-size:11px;padding:4px 8px;}
    .activity-icon{width:30px;height:30px;font-size:13px;}
    .activity-meta{font-size:12px;}
    .result-actions{gap:8px;}
    .result-actions .submit-btn{min-width:0;padding:12px;font-size:15px;}
    .child-row input{font-size:14px;padding:10px 12px;}
    .add-child-btn{padding:6px;font-size:13px;}
    .remove-child-btn{width:36px;height:36px;font-size:16px;}
    .no-result-msg{font-size:13px;padding:8px;}
}

@media (max-width: 360px){
    .welcome-page{padding:6px;}
    .welcome-card,.container{padding:14px;border-radius:10px;}
    .welcome-card h1{font-size:18px;}
    .welcome-card p{font-size:12px;}
    .hero-illustration{max-width:180px;margin:12px auto 16px;}
    .start-btn{padding:10px 16px;font-size:15px;}
    .container h1{font-size:18px;}
    .subtitle{font-size:12px;margin-bottom:14px;}
    input,select{padding:8px 10px;font-size:13px;border-radius:8px;}
    .submit-btn{padding:10px;font-size:16px;}
    .stat-pill strong{font-size:12px;}
    .profile-stats{gap:6px;}
}

.welcome-card{
    background:transparent;
    color:#173b5e;
    width:100%;
    max-width:760px;
    padding:0;
    border-radius:0;
    text-align:center;
    box-shadow:none;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    margin-top:clamp(4px, 4vh, 30px);
}

/* Brand logo pinned to the top-left of the card */
.brand{
    display:flex;
    align-items:center;
    align-self:flex-start;
    margin-bottom:6px;
}

.brand-logo{
    width:clamp(112px, 34vw, 140px);
    height:auto;
    display:block;
}

.welcome-card h1{
    margin:0;
    font-size:clamp(2.1rem, 5vw, 3.2rem);
    line-height:1.1;
}

.welcome-card p{
    margin:0;
    color:#666;
    line-height:1.6;
    font-size:clamp(0.95rem, 2.2vw, 1.12rem);
    max-width:44ch;
    margin-inline:auto;
}

.hero-illustration{
    margin:8px auto 0;
    width:min(100%, 360px);
    max-width:360px;
    padding:14px;
    border-radius:18px;
    background:linear-gradient(135deg, #f8fbff, #dceeff);
    border:2px solid #cfe3f7;
    overflow:hidden;
    box-shadow:0 10px 18px rgba(23,59,94,0.06);
}

.hero-illustration svg{
    display:block;
    max-width:100%;
}

.start-btn{
    display:inline-block;
    background:rgba(23,59,94,.74); /* Navy glass, same family as the login inputs */
    color:#fff;
    padding:16px 28px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.32);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 24px rgba(23,59,94,.22), inset 0 1px 0 rgba(255,255,255,.16);
    text-decoration:none;
    font-size:clamp(1rem, 2.6vw, 1.1rem);
    font-weight:bold;
    font-family:Georgia, 'Times New Roman', Times, serif;
    max-width:100%;
    margin-top:6px;
    transition:background .2s ease, box-shadow .2s ease;
}

.start-btn:hover{
    background:rgba(23,59,94,.88);
    box-shadow:0 14px 28px rgba(23,59,94,.28), inset 0 1px 0 rgba(255,255,255,.16);
}

.start-btn:focus-visible{outline:3px solid #3a79b8;outline-offset:3px;}

body{
    background:#173b5e;
    color:#173b5e;
}

.welcome-page{
    position:relative;
    isolation:isolate;
    min-height:100vh;
    min-height:100svh;
    padding:clamp(18px, 5vw, 56px);
    align-items:center;
    background:#173b5e url('login-bg.webp') center 42% / cover no-repeat;
}

.welcome-page::before{
    position:absolute;
    z-index:-1;
    inset:0;
    content:"";
    background:linear-gradient(110deg, rgba(8,35,56,.28), rgba(8,35,56,.04) 70%), rgba(13,45,70,.12);
}

.welcome-card{
    width:min(100%, 650px);
    max-width:650px;
    margin:0;
    padding:clamp(24px, 5vw, 46px);
    gap:16px;
    border:1px solid rgba(255,255,255,.66);
    border-radius:26px;
    background:rgba(246,250,252,.78);
    box-shadow:0 24px 70px rgba(7,29,48,.24), inset 0 1px 0 rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    animation:welcome-arrive .65s ease-out both;
}

.brand{
    align-self:flex-end;
    margin:0 0 2px;
}

.brand-logo{
    width:clamp(108px, 24vw, 142px);
}

.welcome-card h1{
    color:#173b5e;
    font-size:clamp(2rem, 5vw, 3rem);
}

.welcome-card p{
    color:#496477;
}

.hero-illustration{
    width:min(100%, 330px);
    padding:12px;
    border:1px solid rgba(255,255,255,.82);
    border-radius:18px;
    background:rgba(255,255,255,.56);
    box-shadow:0 12px 30px rgba(23,59,94,.10);
}

.hero-illustration svg{height:auto;}

.start-btn{
    align-self:center;
    padding:14px 30px;
    border-radius:999px;
}

.social-links{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-top:4px;
}

.social-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:42px;
    padding:9px 15px;
    border:1px solid rgba(23,59,94,.13);
    border-radius:999px;
    background:rgba(255,255,255,.58);
    color:#173b5e;
    text-decoration:none;
    font-size:14px;
    font-weight:650;
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

.social-pill svg{
    width:17px;
    height:17px;
    flex:0 0 auto;
}

.social-pill:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.9);
    box-shadow:0 7px 16px rgba(23,59,94,.12);
}

.social-pill:focus-visible{
    outline:3px solid #2a9d8f;
    outline-offset:3px;
}

@keyframes welcome-arrive{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
}

@media (max-width:640px){
    .welcome-page{padding:18px;}
    .welcome-card{padding:24px 18px;gap:13px;border-radius:22px;}
    .start-btn{width:auto;}
    .social-pill{min-height:40px;padding:8px 12px;font-size:13px;}
}

@media (max-width:400px){
    .welcome-page{padding:12px;}
    .welcome-card{padding:20px 14px;}
    .social-links{gap:7px;}
    .social-pill{gap:6px;padding:8px 10px;}
}

@media (prefers-reduced-motion:reduce){
    .welcome-card{animation:none;}
    .social-pill{transition:none;}
}

.welcome-page{
    display:grid;
    grid-template-rows:auto minmax(0, 1fr) auto;
    align-items:stretch;
    justify-content:stretch;
    gap:clamp(22px, 4vh, 38px);
    min-height:100vh;
    min-height:100svh;
    padding:clamp(16px, 3vw, 34px) clamp(16px, 5vw, 64px);
    padding-bottom:clamp(44px, 7vh, 72px);
}

.site-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    width:100%;
}

.brand{
    display:block;
    align-self:auto;
    flex:0 1 auto;
    margin:0;
}

.brand-logo{
    display:block;
    width:clamp(92px, 11vw, 136px);
    height:auto;
    background:transparent;
}

.social-links{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:clamp(7px, 1.2vw, 12px);
    margin:0;
}

.social-pill{
    display:grid;
    place-items:center;
    width:clamp(38px, 4vw, 46px);
    height:clamp(38px, 4vw, 46px);
    min-height:0;
    padding:0;
    border:1px solid rgba(255,255,255,.28);
    border-radius:50%;
    background:rgba(11,35,51,.28);
    color:#fff;
    box-shadow:0 8px 22px rgba(7,29,48,.16), inset 0 1px 0 rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
}

.social-pill svg{
    width:19px;
    height:19px;
}

.welcome-card{
    align-self:center;
    justify-self:center;
    width:min(100%, 760px);
    max-width:760px;
    margin:0;
    position:relative;
    top:clamp(-42px, -4vh, -22px);
    padding:0;
    gap:clamp(14px, 2.5vh, 22px);
    border:0;
    border-radius:0;
    background:transparent;
    box-shadow:none;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    animation:welcome-arrive .65s ease-out both;
}

.welcome-card h1{
    color:#fff;
    text-shadow:0 2px 18px rgba(7,29,48,.35);
}

.welcome-card p{
    color:rgba(255,255,255,.94);
    text-shadow:0 1px 12px rgba(7,29,48,.4);
}

.hero-illustration{
    width:min(100%, 330px);
    padding:0;
    border:0;
    border-radius:0;
    background:transparent;
    box-shadow:none;
}

.home-footer{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    width:100%;
}

.start-btn,
.about-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:152px;
    min-height:48px;
    margin:0;
    padding:12px 24px;
    border:1px solid rgba(255,255,255,.48);
    border-radius:999px;
    color:#fff;
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    text-decoration:none;
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

.start-btn{
    background:rgba(23,59,94,.82);
    box-shadow:0 10px 24px rgba(7,29,48,.22), inset 0 1px 0 rgba(255,255,255,.18);
}

.about-btn{
    background:rgba(245,250,252,.2);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
}

.start-btn:hover,
.about-btn:hover{
    transform:translateY(-2px);
    background-color:rgba(23,59,94,.94);
    box-shadow:0 13px 28px rgba(7,29,48,.25);
}

.start-btn:focus-visible,
.about-btn:focus-visible{
    outline:3px solid #fff;
    outline-offset:3px;
}

.social-pill:focus-visible{
    outline:3px solid #fff;
    outline-offset:3px;
}

@media (max-width:640px){
    .welcome-page{padding:16px 16px 56px;gap:20px;}
    .welcome-card{padding:0;gap:13px;border-radius:0;}
    .welcome-card{top:-20px;}
    .start-btn,.about-btn{width:auto;}
    .home-footer{gap:10px;}
}

@media (max-width:400px){
    .welcome-page{padding:12px 12px 48px;gap:16px;}
    .site-header{gap:8px;}
    .social-links{gap:6px;}
    .social-pill{width:36px;height:36px;}
    .home-footer{gap:8px;}
    .start-btn,.about-btn{min-width:0;min-height:44px;flex:1;padding:10px 12px;font-size:.92rem;}
}

@media (prefers-reduced-motion:reduce){
    .welcome-card,.social-pill,.start-btn,.about-btn{animation:none;transition:none;}
}

</style>
</head>
