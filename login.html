<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | School ZA</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    padding:clamp(24px, 8vh, 72px) clamp(16px, 5vw, 48px);
    color:#173b5e;
    background:#fff;
}

.login-page{
    width:100%;
    max-width:460px;
}

.login-card{
    width:100%;
}

h1{
    text-align:left;
    font-size:clamp(26px, 7vw, 30px);
    margin-bottom:8px;
}

.subtitle{
    color:#667788;
    text-align:left;
    line-height:1.5;
    margin-bottom:28px;
}

.form-group{
    display:grid;
    gap:8px;
    margin-bottom:18px;
}

label{
    font-size:14px;
    font-weight:700;
}

input{
    width:100%;
    padding:14px 15px;
    border:1px solid #cbd7e3;
    border-radius:10px;
    color:#173b5e;
    background:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#3a79b8;
    box-shadow:0 0 0 3px rgba(58,121,184,0.16);
}

.input-hint{
    min-height:18px;
    color:#b42318;
    font-size:13px;
}

.password-input-wrapper{
    position:relative;
}

.password-input-wrapper input{
    padding-right:50px;
}

.password-toggle{
    position:absolute;
    top:50%;
    right:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:32px;
    height:32px;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#5d6f80;
    cursor:pointer;
}

.password-toggle svg{
    width:20px;
    height:20px;
}

.form-message{
    min-height:22px;
    margin-bottom:12px;
    color:#b42318;
    font-size:14px;
    text-align:left;
}

.form-message.success{
    color:#2e7d32;
}

.submit-btn{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px 20px;
    background:#173b5e;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

.submit-btn:hover{background:#0f2a45;}
.submit-btn:focus-visible{outline:3px solid #3a79b8;outline-offset:3px;}

.or-divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:20px 0 14px;
    color:#667788;
    font-size:13px;
    font-weight:600;
}

.or-divider::before,
.or-divider::after{
    content:'';
    height:1px;
    flex:1;
    background:#cbd7e3;
}

.secondary-link{
    display:block;
    margin-top:20px;
    color:#173b5e;
    text-align:left;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
}

.secondary-link:hover{text-decoration:underline;}

@media (max-width:480px){
    body{padding:28px 16px 24px;}
}
</style>
</head>
<body>
<main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
        <h1 id="loginTitle">Welcome back</h1>
        <p class="subtitle">Sign in to access your account.</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="emailInput">Email address</label>
                <input type="email" id="emailInput" name="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required>
                <div class="input-hint" id="emailHint" aria-live="polite"></div>
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="passwordInput" name="password" autocomplete="current-password" placeholder="Enter your password" minlength="6" required>
                    <button type="button" class="password-toggle" id="passwordToggle" title="Show password" aria-label="Show password"></button>
                </div>
                <div class="input-hint" id="passwordHint" aria-live="polite"></div>
            </div>

            <div class="or-divider" aria-hidden="true">OR</div>
            <div id="buttonDiv"></div>
            <div class="form-message" id="formMessage" role="status" aria-live="polite"></div>
            <button class="submit-btn" type="submit">Sign in</button>
        </form>

        <a class="secondary-link" href="create-profile.html">Don't have an account? Sign up</a>
    </section>
</main>

<script>
const loginForm = document.getElementById('loginForm');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const passwordToggle = document.getElementById('passwordToggle');
const emailHint = document.getElementById('emailHint');
const passwordHint = document.getElementById('passwordHint');
const formMessage = document.getElementById('formMessage');

function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>';
const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.1 3.9"></path><path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 3.4-.6"></path></svg>';

passwordToggle.innerHTML = eyeIcon;
passwordToggle.addEventListener('click', function() {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.innerHTML = type === 'password' ? eyeIcon : eyeOffIcon;
    this.title = type === 'password' ? 'Show password' : 'Hide password';
    this.setAttribute('aria-label', this.title);
});

function readExistingAccounts() {
    const accounts = [];
    try {
        const registry = JSON.parse(localStorage.getItem('schoolUsersRegistry') || '[]');
        if (Array.isArray(registry)) accounts.push(...registry);
    } catch (error) {
        // Ignore malformed optional registry data and use the active profile below.
    }

    try {
        const profile = JSON.parse(localStorage.getItem('schoolProfileData') || 'null');
        if (profile && profile.email) accounts.push(profile);
    } catch (error) {
        // Ignore malformed optional profile data.
    }

    return accounts;
}

function handleCredentialResponse(response) {
    if (!response || !response.credential) {
        formMessage.textContent = 'Google sign-in could not be completed.';
        return;
    }

    const tokenParts = response.credential.split('.');
    if (tokenParts.length < 2) {
        formMessage.textContent = 'Google returned an invalid sign-in response.';
        return;
    }

    try {
        const profile = JSON.parse(atob(tokenParts[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (profile.email && isValidEmail(profile.email)) {
            emailInput.value = profile.email;
            formMessage.textContent = 'Google email selected. Enter your password to continue.';
            formMessage.className = 'form-message success';
        }
    } catch (error) {
        formMessage.textContent = 'Google sign-in could not be read.';
    }
}

window.onload = function () {
    google.accounts.id.initialize({
        client_id: "163015511783-arhp744k317dd4kdhm68rtrpcqam3h97.apps.googleusercontent.com",
        callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        { theme: "outline", size: "large" }
    );
};

loginForm.addEventListener('submit', function(event) {
    event.preventDefault();
    emailHint.textContent = '';
    passwordHint.textContent = '';
    formMessage.textContent = '';
    formMessage.className = 'form-message';

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    let isValid = true;

    if (!isValidEmail(email)) {
        emailHint.textContent = 'Enter a valid email address.';
        isValid = false;
    }

    if (password.length < 6) {
        passwordHint.textContent = 'Password must be at least 6 characters.';
        isValid = false;
    }

    if (!isValid) return;

    const accountExists = readExistingAccounts().some(account => {
        return (account.email || '').trim().toLowerCase() === email;
    });

    if (!accountExists) {
        formMessage.textContent = 'No existing account was found for this email.';
        return;
    }

    localStorage.setItem('schoolSession', JSON.stringify({
        email,
        signedInAt: new Date().toISOString()
    }));
    formMessage.textContent = 'Sign-in successful. Opening your account...';
    formMessage.className = 'form-message success';
    window.setTimeout(() => {
        window.location.href = 'admin-feed.html';
    }, 250);
});
</script>
</body>
</html>
