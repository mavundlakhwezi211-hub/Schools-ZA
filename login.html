<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | School ZA</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="api-client.js"></script>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    padding:clamp(24px, 8vh, 72px) clamp(16px, 5vw, 48px);
    color:#fff;
    background-color:#12283d;
    background-image:linear-gradient(100deg,rgba(9,20,32,.86) 0%,rgba(9,20,32,.76) 45%,rgba(9,20,32,.55) 100%),url('login-bg.webp');
    background-position:center,center;
    background-size:cover,cover;
    background-repeat:no-repeat,no-repeat;
}

.login-page{
    width:100%;
    max-width:460px;
}

.login-card{
    width:100%;
}

h1{
    text-align:left;
    font-size:clamp(26px, 7vw, 30px);
    margin-bottom:8px;
}

.subtitle{
    color:rgba(255,255,255,.88);
    text-align:left;
    line-height:1.5;
    margin-bottom:28px;
}

/* 1. Input fields with inline icons */
.login-form{
    width:100%;
}

.input-group{
    position:relative;
    margin-bottom:12px;
}

.input-group input{
    width:100%;
    padding:14px 16px 14px 44px; /* Leaves clear spacing for the icon on the left */
    border:1px solid rgba(255,255,255,.32);
    border-radius:12px;
    background-color:rgba(9,20,32,.46); /* Dark glass tuned to the photo backdrop */
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:14px;
    color:#ffffff;
    box-sizing:border-box;
    box-shadow:0 8px 20px rgba(4,10,18,.22);
    transition:all .2s ease-in-out;
}

.input-group input::placeholder{
    color:rgba(255,255,255,.6);
    opacity:1; /* Firefox otherwise dims placeholders */
}

/* Lifts the glass brighter when clicked */
.input-group input:focus{
    outline:none;
    background-color:rgba(9,20,32,.62);
    border-color:rgba(255,255,255,.85);
    box-shadow:0 0 0 3px rgba(255,255,255,.2);
}

.input-group input:-webkit-autofill{
    -webkit-text-fill-color:#ffffff;
    -webkit-box-shadow:0 0 0 100px rgba(9,20,32,.86) inset;
    caret-color:#ffffff;
}

/* Forgot Password text */
.forgot-pass{
    display:block;
    text-align:right;
    font-size:13px;
    color:rgba(255,255,255,.92);
    text-decoration:none;
    margin:8px 0 20px 0;
    font-weight:500;
}

.forgot-pass:hover{
    text-decoration:underline;
}

.input-hint{
    min-height:18px;
    color:#ffb4a9;
    font-size:13px;
    margin:-6px 0 10px;
}

.input-hint:empty,
.form-message:empty{
    display:none;
}

/* Positioning for inline icons */
.input-icon{
    position:absolute;
    z-index:2;
    left:16px;
    top:52%;
    transform:translateY(-50%);
    color:rgba(255,255,255,.7);
    display:flex;
    align-items:center;
    pointer-events:none;
}

.toggle-password{
    position:absolute;
    right:16px;
    top:52%;
    transform:translateY(-50%);
    cursor:pointer;
    color:rgba(255,255,255,.8);
    display:flex;
    align-items:center;
    border:0;
    padding:0;
    background:transparent;
}

.input-icon svg,
.toggle-password svg{
    width:16px;
    height:16px;
    display:block;
}

.input-icon .icon-mail,
.input-icon .icon-lock{
    width:18px;
    height:18px;
    color:#aeb7c2;
    vertical-align:middle;
}

.input-group:focus-within .icon-mail,
.input-group:focus-within .icon-lock{
    color:#fff;
}

.form-message{
    min-height:22px;
    margin-bottom:12px;
    color:#ffb4a9;
    font-size:14px;
    text-align:left;
}

.form-message.success{
    color:#8ce39a;
}

.form-message.info{
    color:rgba(255,255,255,.85);
}

/* 2. Main dark button */
.btn-submit{
    width:100%;
    padding:14px;
    background-color:#1c1c1f; /* Charcoal dark finish */
    color:#ffffff;
    border:1px solid rgba(255,255,255,.26);
    border-radius:12px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:background-color .2s ease;
    box-shadow:0 12px 26px rgba(4,10,18,.42);
}

.btn-submit:hover{background-color:#2d2d32;}
.btn-submit:focus-visible{outline:3px solid rgba(255,255,255,.75);outline-offset:3px;}

/* 3. Dotted split separator */
.form-divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:24px 0;
}

.form-divider::before{
    content:'';
    flex:1;
    border-top:1px dotted #cbd5e1; /* Subtle dotted divider line */
}

.form-divider::after{
    content:'';
    flex:1;
    border-top:1px dotted #cbd5e1;
}

.form-divider span{
    background:transparent;
    padding:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    color:rgba(255,255,255,.85);
}

/* 4. Social login grid layout */
.social-grid{
    display:grid;
    grid-template-columns:1fr; /* Single Google tile spans the form width */
    gap:12px;
}

.social-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:13px 16px;
    border:1px solid rgba(255,255,255,.32);
    border-radius:12px;
    background:rgba(9,20,32,.46); /* Same glass family as the inputs */
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    color:#ffffff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(4,10,18,.22);
    transition:all .2s ease;
}

.social-btn:hover{
    background:rgba(9,20,32,.62);
    border-color:rgba(255,255,255,.55);
}

.social-btn svg{
    width:18px;
    height:18px;
    flex:0 0 auto;
    display:block;
}

.secondary-link{
    display:block;
    margin-top:22px;
    color:#fff;
    text-align:left;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
}

.secondary-link:hover{text-decoration:underline;}

@media (max-width:480px){
    body{padding:28px 16px 24px;}
}
</style>
</head>
<body>
<main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
        <h1 id="loginTitle">Welcome back</h1>
        <p class="subtitle">Sign in to access your account.</p>

        <form id="loginForm" class="login-form" novalidate>
            <div class="input-group">
                <span class="input-icon">
                    <!-- Mail Icon -->
                    <svg class="icon-mail" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                </span>
                <input type="email" id="emailInput" name="email" autocomplete="email" inputmode="email" placeholder="Email" aria-label="Email address" required>
            </div>
            <div class="input-hint" id="emailHint" aria-live="polite"></div>

            <div class="input-group">
                <span class="input-icon">
                    <!-- Lock Icon -->
                    <svg class="icon-lock" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </span>
                <input type="password" id="passwordInput" name="password" autocomplete="current-password" placeholder="Password" minlength="6" aria-label="Password" required>
                <button type="button" class="toggle-password" id="passwordToggle" title="Show password" aria-label="Show password">
                    <!-- Hide/Show Eye Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                </button>
            </div>
            <div class="input-hint" id="passwordHint" aria-live="polite"></div>

            <a href="#" class="forgot-pass">Forgot password?</a>

            <div class="form-message" id="formMessage" role="status" aria-live="polite"></div>

            <!-- Main Action Button -->
            <button type="submit" class="btn-submit">Get Started</button>
        </form>

        <!-- Dotted Divider Line -->
        <div class="form-divider">
            <span>OR</span>
        </div>

        <!-- Social Buttons Grid -->
        <div class="social-grid">
            <button type="button" class="social-btn" id="googleSignIn" aria-label="Continue with Google">
                <!-- Google Brand Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582l3.51-3.51C17.642 1.078 14.974 0 12 0 7.354 0 3.307 2.67 1.242 6.56l4.024 3.205z"/><path fill="#FBBC05" d="M1.242 6.56A11.895 11.895 0 0 0 0 12c0 1.926.433 3.748 1.207 5.388l4.062-3.152a7.074 7.074 0 0 1-.035-4.471L1.242 6.56z"/><path fill="#4285F4" d="M23.49 12.275c0-.825-.074-1.62-.21-2.387H12v4.513h6.44a5.504 5.504 0 0 1-2.387 3.61l3.724 2.885c2.175-2.005 3.713-4.957 3.713-8.621z"/><path fill="#34A853" d="M16.053 18.01c-1.127.757-2.556 1.205-4.053 1.205-2.94 0-5.434-1.984-6.323-4.654l-4.062 3.152C3.682 21.676 7.55 24 12 24c3.24 0 5.962-1.073 7.95-2.915l-3.897-3.076z"/></svg>
                <span>Continue with Google</span>
            </button>
        </div>

        <a class="secondary-link" href="create-profile.html">Don't have an account? Sign up</a>
    </section>
</main>

<script>
const loginForm = document.getElementById('loginForm');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const passwordToggle = document.getElementById('passwordToggle');
const emailHint = document.getElementById('emailHint');
const passwordHint = document.getElementById('passwordHint');
const formMessage = document.getElementById('formMessage');

function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>';
const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line></svg>';

// State icon: masked -> slashed eye (matches the template), revealed -> open eye.
passwordToggle.innerHTML = eyeOffIcon;
passwordToggle.addEventListener('click', function() {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.innerHTML = type === 'password' ? eyeOffIcon : eyeIcon;
    this.title = type === 'password' ? 'Show password' : 'Hide password';
    this.setAttribute('aria-label', this.title);
});

// Turns a Google credential into an app session (same rules as the email form).
async function signInWithGoogleCredential(token) {
    googleFlow.settled = true;
    try {
        const result = await window.UrskoolApi.request('api/auth.php?action=google', {
            method: 'POST',
            body: { credential: token }
        });
        window.UrskoolApi.cacheUser(result.user);
        if (result.requiresOtp) {
            window.location.replace('otp-method.html');
            return;
        }
        setGoogleMessage('Signed in with Google. Opening your account...', 'success');
        window.setTimeout(() => {
            window.location.href = 'admin-feed.html';
        }, 250);
    } catch (error) {
        if (error.code === 'account_not_found') {
            setGoogleMessage('This Google email does not have an UrSKOOL account. Please sign up to create one.', '');
        } else {
            setGoogleMessage(error.message || 'Google sign-in could not be verified. Try again, or use your email above.', '');
        }
    }
}

function handleCredentialResponse(response) {
    if (!response || !response.credential) {
        setGoogleMessage('Google sign-in could not be completed.', '');
        return;
    }
    signInWithGoogleCredential(response.credential);
}

// Google OAuth 2.0 client ID for the "Continue with Google" button.
// Must match GOOGLE_CLIENT_ID in the PHP environment because api/auth.php
// verifies the returned ID token's `aud` claim against it, and the page origin
// must be listed under "Authorized JavaScript origins" in the Google Cloud console.
const GOOGLE_CLIENT_ID = "163015511783-arhp744k317dd4kdhm68rtrpcqam3h97.apps.googleusercontent.com";
const GOOGLE_SCOPE = 'openid email profile';
let gsiReady = false;
const googleFlow = { started: false, settled: false, promptShown: false, popup: null, tokenClient: null };

function setGoogleMessage(text, kind) {
    formMessage.textContent = text;
    formMessage.className = 'form-message' + (kind ? ' ' + kind : '');
}

// Fallback path: standard OAuth id_token popup (used when One Tap is unavailable).
function openGooglePopup() {
    if (googleFlow.started || location.protocol === 'file:') return;
    googleFlow.started = true;

    const redirectUri = location.href.split('#')[0];
    const nonce = (window.crypto && window.crypto.randomUUID)
        ? window.crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(16).slice(2);
    const url = 'https://accounts.google.com/o/oauth2/v2/auth'
        + '?client_id=' + encodeURIComponent(GOOGLE_CLIENT_ID)
        + '&redirect_uri=' + encodeURIComponent(redirectUri)
        + '&response_type=id_token'
        + '&scope=' + encodeURIComponent(GOOGLE_SCOPE)
        + '&nonce=' + encodeURIComponent(nonce)
        + '&prompt=select_account';

    const popup = window.open(url, 'googleAuth', 'width=480,height=640');
    if (!popup) {
        googleFlow.started = false;
        setGoogleMessage('Your browser blocked the Google window. Allow pop-ups for this site.', '');
        return;
    }

    googleFlow.popup = popup;
    setGoogleMessage('Waiting for Google in the new window...', 'info');

    const poll = window.setInterval(function () {
        if (googleFlow.popup && googleFlow.popup.closed) {
            window.clearInterval(poll);
            googleFlow.popup = null;
            googleFlow.started = false;
            if (!googleFlow.settled) setGoogleMessage('Google sign-in was cancelled.', '');
        }
    }, 400);
}

// Runs on the page Google redirects back to (inside the popup, or a directly opened tab).
function consumeGoogleAuthReturn() {
    const hash = location.hash || '';
    const tokenMatch = hash.match(/id_token=([^&]+)/);
    const errorMatch = hash.match(/error=([^&]+)/);
    if (!tokenMatch && !errorMatch) return false;

    const token = tokenMatch ? decodeURIComponent(tokenMatch[1]) : null;
    const error = errorMatch ? decodeURIComponent(errorMatch[1]) : null;
    history.replaceState(null, '', location.pathname + location.search);

    if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ source: 'urskool-google-auth', id_token: token, error: error }, location.origin);
        window.setTimeout(function () { window.close(); }, 400);
    } else if (token) {
        signInWithGoogleCredential(token);
    } else {
        setGoogleMessage('Google sign-in was cancelled or refused.', '');
    }
    return true;
}

// Result arriving from the popup (same origin only).
window.addEventListener('message', function (event) {
    if (event.origin !== location.origin) return;
    const data = event.data;
    if (!data || data.source !== 'urskool-google-auth') return;
    googleFlow.started = false;
    googleFlow.popup = null;
    if (data.id_token) {
        signInWithGoogleCredential(data.id_token);
    } else if (data.error) {
        setGoogleMessage('Google sign-in was cancelled or refused.', '');
    }
});

// Primary path: the GIS token client. It returns an ID token straight into the
// callback, so unlike the implicit `response_type=id_token` popup below it needs
// no redirect URI registered in the Google Cloud console - only the page origin
// under "Authorized JavaScript origins".
function requestGoogleIdToken() {
    const oauth2 = window.google && window.google.accounts && window.google.accounts.oauth2;
    if (!oauth2 || typeof oauth2.initTokenClient !== 'function') return false;

    const tokenClient = oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_SCOPE,
        callback: function (response) {
            googleFlow.started = false;
            if (response && response.id_token) {
                signInWithGoogleCredential(response.id_token);
            } else {
                setGoogleMessage('Google sign-in was cancelled or refused.', '');
            }
        },
        error_callback: function (error) {
            googleFlow.started = false;
            const type = (error && error.type) || '';
            if (type === 'popup_closed') {
                setGoogleMessage('Google sign-in was cancelled.', '');
                return;
            }
            // Fall back to the popup flow rather than leaving the button dead.
            if (!googleFlow.settled) openGooglePopup();
        }
    });

    googleFlow.tokenClient = tokenClient;
    setGoogleMessage('Waiting for Google...', 'info');
    tokenClient.requestAccessToken({ prompt: '' });
    return true;
}

function signInWithGoogle() {
    setGoogleMessage('', '');

    if (location.protocol === 'file:') {
        setGoogleMessage('Google sign-in needs this page served over localhost or a website - not opened as a file.', '');
        return;
    }
    if (googleFlow.started) return;

    googleFlow.started = true;
    googleFlow.settled = false;

    if (requestGoogleIdToken()) return;

    googleFlow.started = false;
    if (gsiReady && typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        google.accounts.id.prompt({
            momentListener: function (event) {
                if (event.isDisplayed && event.isDisplayed()) {
                    googleFlow.promptShown = true;
                    setGoogleMessage('Choose your account in the Google prompt.', 'info');
                    return;
                }
                if ((event.isNotDisplayed && event.isNotDisplayed()) ||
                    (event.isSkippedMoment && event.isSkippedMoment())) {
                    openGooglePopup();
                    return;
                }
                if (event.isDismissedMoment && event.isDismissedMoment()) {
                    setGoogleMessage('Google prompt closed. Click again to continue.', 'info');
                }
            }
        });
        // If One Tap stays silent, fall back to the popup so the button always does something.
        window.setTimeout(function () {
            if (!googleFlow.promptShown && !googleFlow.started && !googleFlow.settled) openGooglePopup();
        }, 1200);
    } else {
        openGooglePopup();
    }
}

document.getElementById('googleSignIn').addEventListener('click', signInWithGoogle);
consumeGoogleAuthReturn();

// The GIS library is loaded with `async`, so `window.onload` may already have
// fired by the time this inline script runs. Poll briefly so the button works
// either way instead of depending on which happened to come first.
(function initGoogleIdentity() {
    if (initGoogleIdentity.initialized) return;
    if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) return;
    initGoogleIdentity.initialized = true;

    google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
    });
    gsiReady = true;
})();

if (!window.google || !window.google.accounts) {
    let googleInitAttempts = 0;
    const googleInitTimer = window.setInterval(function () {
        initGoogleIdentity();
        if (gsiReady || ++googleInitAttempts >= 40) window.clearInterval(googleInitTimer);
    }, 250);
}

loginForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    emailHint.textContent = '';
    passwordHint.textContent = '';
    formMessage.textContent = '';
    formMessage.className = 'form-message';

    localStorage.removeItem('schoolSession');

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!isValidEmail(email)) {
        emailHint.textContent = 'Enter a valid email address.';
        return;
    }

    try {
        const result = await window.UrskoolApi.request('api/auth.php?action=login', {
            method: 'POST',
            body: { email, password }
        });
        window.UrskoolApi.cacheUser(result.user);
        if (result.requiresOtp) {
            formMessage.textContent = 'Verify your account with a one-time code to continue.';
            formMessage.className = 'form-message info';
            window.location.replace('otp-method.html');
            return;
        }
        formMessage.textContent = 'Sign-in successful. Opening your account...';
        formMessage.className = 'form-message success';
        window.setTimeout(() => { window.location.href = 'admin-feed.html'; }, 250);
    } catch (error) {
        if (error.code === 'account_not_found') {
            formMessage.textContent = 'No account found for this email. Sign up to create a new account.';
        } else if (error.code === 'invalid_credentials') {
            formMessage.textContent = error.message;
        } else {
            formMessage.textContent = error.message || 'Unable to sign in. Please try again.';
        }
    }
});
</script>
</body>
</html>
