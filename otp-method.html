<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose OTP Delivery | UrSKOOL</title>
<script src="api-client.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{min-height:100vh;background:linear-gradient(135deg,#f9fbfc,#e8f0f4);color:#111;}
.page{min-height:100vh;display:grid;place-items:start center;padding:clamp(52px,10vh,92px) 16px 28px;}
.card{width:min(100%,520px);padding:clamp(24px,6vw,40px);background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.82);border-radius:0;box-shadow:0 20px 48px rgba(23,59,94,.1),inset 0 1px 0 rgba(255,255,255,.65);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);}
h1{font-size:clamp(25px,6vw,32px);line-height:1.2;margin-bottom:8px;}
.intro{color:#666;line-height:1.55;margin-bottom:22px;}
.profile{margin:0 0 28px;font-size:15px;font-weight:650;color:#36556a;}
fieldset{display:grid;gap:10px;border:0;}
legend{margin-bottom:12px;font-weight:700;}
.choice{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:center;padding:15px 0;border-top:1px solid #d9dfe3;cursor:pointer;}
.choice:last-of-type{border-bottom:1px solid #d9dfe3;}
.choice:has(input:checked){color:#173b5e;}
.choice input{width:18px;height:18px;margin:0;accent-color:#2a7890;}
.choice-copy{display:grid;min-width:0;}
.choice-copy strong{font-size:15px;}
.status{min-height:22px;margin:14px 0;color:#a83232;font-size:13px;line-height:1.5;}
.status:empty{min-height:8px;margin:7px 0;}
.continue{width:100%;min-height:50px;border:1px solid rgba(255,255,255,.58);border-radius:999px;background:rgba(23,59,94,.78);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(23,59,94,.16),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .18s ease,transform .18s ease;}
.continue:hover{background:rgba(15,42,69,.9);transform:translateY(-1px);}
.continue:focus-visible,.choice input:focus-visible{outline:3px solid #2a9d8f;outline-offset:3px;}
@media(max-width:380px){.card{padding:22px 18px;}}
</style>
</head>
<body>
<main class="page">
    <section class="card" aria-labelledby="pageTitle">
        <h1 id="pageTitle">Where should we send your code?</h1>
        <p class="intro">Choose how you would like to receive your one-time verification code.</p>
        <p class="profile" id="profileName"></p>
        <form id="methodForm">
            <fieldset>
                <legend>Choose a delivery method</legend>
                <label class="choice">
                    <input type="radio" name="deliveryMethod" value="email" required>
                    <span class="choice-copy"><strong>Email</strong></span>
                </label>
                <label class="choice">
                    <input type="radio" name="deliveryMethod" value="phone" required>
                    <span class="choice-copy"><strong>Phone number</strong></span>
                </label>
            </fieldset>
            <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
            <button class="continue" type="submit">Continue</button>
        </form>
    </section>
</main>
<script>
const form = document.getElementById('methodForm');
const statusMessage = document.getElementById('statusMessage');
let pendingProfile = null;

async function loadPendingProfile() {
    try {
        const result = await window.UrskoolApi.request('api/auth.php?action=pending');
        pendingProfile = result.user;
        window.UrskoolApi.cacheUser(pendingProfile);
        document.getElementById('profileName').textContent = pendingProfile.fullName || [pendingProfile.firstName, pendingProfile.lastName].filter(Boolean).join(' ') || 'Not provided';
        document.querySelector('input[name="deliveryMethod"][value="phone"]').disabled = !pendingProfile.phone;
    } catch (error) {
        statusMessage.textContent = error.message;
        form.querySelectorAll('input,button').forEach(control => { control.disabled = true; });
        window.setTimeout(() => window.location.replace('login.html'), 1800);
    }
}

form.addEventListener('submit', event => {
    event.preventDefault();
    const selectedMethod = form.elements.deliveryMethod.value;

    if (!selectedMethod) {
        statusMessage.textContent = 'Choose email or phone to continue.';
        return;
    }

    localStorage.setItem('otpDeliveryMethod', selectedMethod);
    window.location.href = selectedMethod === 'phone' ? 'phone-verify.html' : 'email-verify.html';
});

loadPendingProfile();
</script>
</body>
</html>
