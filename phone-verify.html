<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Verification</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
        body{min-height:100vh;background:linear-gradient(135deg,#f9fbfc,#e8f0f4);color:#111;display:flex;justify-content:center;align-items:flex-start;padding:clamp(52px,11vh,104px) 20px 28px;overflow-x:hidden;}
        .verification-container{width:100%;max-width:520px;padding:clamp(24px,5vw,40px);text-align:center;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 20px 48px rgba(23,59,94,.1),inset 0 1px 0 rgba(255,255,255,.68);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);}
        h1{font-size:clamp(2rem,5vw,2.7rem);line-height:1.15;margin-bottom:14px;}
        .subtitle{color:#666;line-height:1.6;margin-bottom:30px;font-size:clamp(1rem,2.5vw,1.15rem);overflow-wrap:anywhere;}
        .code-inputs{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;}
        .code-input{width:52px;height:56px;font-size:24px;font-weight:600;text-align:center;border:1px solid rgba(255,255,255,.88);border-radius:10px;background:rgba(255,255,255,.68);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);outline:none;}
        .code-input:focus{border-color:#000;box-shadow:0 0 0 2px rgba(0,0,0,.05);}
        .divider{color:#aaa;font-size:18px;padding:0 4px;}
        .resend-btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 18px;margin-bottom:20px;border:1px solid rgba(255,255,255,.86);border-radius:999px;background:rgba(255,255,255,.46);color:#173b5e;font-size:13px;font-weight:650;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
        .continue-btn{width:100%;min-height:52px;padding:14px 20px;border-radius:999px;font-size:16px;font-weight:700;border:1px solid rgba(255,255,255,.8);cursor:not-allowed;background:rgba(255,255,255,.46);color:#82909a;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 20px rgba(23,59,94,.08);}
        .continue-btn.active{background:rgba(23,59,94,.82);color:#fff;cursor:pointer;box-shadow:0 10px 24px rgba(23,59,94,.18),inset 0 1px 0 rgba(255,255,255,.18);}
        .continue-btn.active:hover,.resend-btn:hover{background-color:rgba(23,59,94,.9);color:#fff;}
        .status-message{min-height:20px;margin-top:14px;color:#666;font-size:13px;line-height:1.5;}
        .status-message.error{color:#b42318;}
        .status-message.success{color:#2e7d32;}
        .continue-btn:focus-visible,.resend-btn:focus-visible{outline:3px solid #2a9d8f;outline-offset:3px;}
        @media(max-width:420px){body{padding:42px 14px 20px;}.verification-container{padding:22px 16px;}.code-inputs{gap:8px;}.code-input{width:48px;height:52px;font-size:22px;}h1{font-size:2.15rem;}.subtitle{font-size:1rem;}.continue-btn{font-size:16px;padding:14px;}}
        @media(max-width:320px){.verification-container{padding:20px 10px;}.code-inputs{gap:6px;}.code-input{width:38px;height:46px;font-size:20px;}.divider{padding:0 2px;}h1{font-size:1.9rem;}.subtitle{font-size:.95rem;}}
    </style>
    <script src="api-client.js"></script>
    <script src="firebase-config.js"></script>
    <script type="module" src="firebase-phone.js"></script>
</head>
<body>
    <main class="verification-container">
        <h1>Verify Your Phone Number</h1>
        <p class="subtitle">Enter the 6-digit verification code for<br><strong id="phoneBox"></strong></p>
        <div class="code-inputs" aria-label="Verification code">
            <input class="code-input" type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 1" autofocus>
            <input class="code-input" type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 2">
            <input class="code-input" type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 3">
            <span class="divider" aria-hidden="true">-</span>
            <input class="code-input" type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 4">
            <input class="code-input" type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 5">
            <input class="code-input" type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 6">
        </div>
        <button class="resend-btn" id="resendBtn" type="button">Send Again</button>
        <button class="continue-btn" id="continueBtn" type="button" disabled>Continue</button>
        <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>
        <div id="recaptcha-container"></div>
    </main>
    <script>
        const phoneBox = document.getElementById('phoneBox');
        const statusMessage = document.getElementById('statusMessage');
        const continueBtn = document.getElementById('continueBtn');
        const resendBtn = document.getElementById('resendBtn');
        const inputs = [...document.querySelectorAll('.code-input')];
        let pendingProfile = null;
        let demoCode = '';

        function updateStatus(message, state = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message' + (state === 'error' ? ' error' : state === 'success' ? ' success' : '');
        }

        function checkCompletion() {
            const complete = inputs.every(input => /^[0-9]$/.test(input.value));
            continueBtn.disabled = !complete;
            continueBtn.classList.toggle('active', complete);
        }

        function waitForFirebasePhone() {
            if (window.UrskoolFirebasePhone) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const timeout = window.setTimeout(() => reject(new Error('Firebase Phone Auth did not load.')), 15000);
                window.addEventListener('urskool-firebase-phone-ready', () => {
                    window.clearTimeout(timeout);
                    resolve();
                }, { once: true });
                window.addEventListener('urskool-firebase-phone-error', event => {
                    window.clearTimeout(timeout);
                    reject(new Error(event.detail || 'Firebase Phone Auth could not initialize.'));
                }, { once: true });
            });
        }

        async function sendCode() {
            resendBtn.disabled = true;
            if (demoCode) {
                updateStatus('Demo mode: enter the demo code ' + demoCode + '. No SMS was sent.');
                resendBtn.disabled = false;
                return;
            }
            updateStatus('Sending verification code...');
            try {
                await waitForFirebasePhone();
                await window.UrskoolFirebasePhone.send(pendingProfile.phone);
                updateStatus('A verification code has been sent.');
            } catch (error) {
                updateStatus(error.message || 'We could not send the verification code. Please try again.', 'error');
            } finally {
                resendBtn.disabled = false;
            }
        }

        async function verifyCode() {
            const code = inputs.map(input => input.value).join('');
            if (code.length !== 6) {
                updateStatus('Please enter the full 6-digit code.', 'error');
                return;
            }
            continueBtn.disabled = true;
            try {
                const demoAttempt = Boolean(demoCode) && code === demoCode;
                const idToken = demoAttempt ? null : await window.UrskoolFirebasePhone.verify(code);
                const result = await window.UrskoolApi.request('api/auth.php?action=firebase-phone-verify', {
                    method: 'POST',
                    body: demoAttempt ? { code } : { idToken }
                });
                window.UrskoolApi.cacheUser(result.user);
                localStorage.removeItem('otpDeliveryMethod');
                updateStatus('Phone number verified. Redirecting...', 'success');
                window.setTimeout(() => {
                    window.location.href = result.purpose === 'login' ? 'admin-feed.html' : 'profile-success.html';
                }, 800);
            } catch (error) {
                updateStatus(error.message || 'We could not verify this code. Please try again.', 'error');
                checkCompletion();
            }
        }

        async function loadPendingVerification() {
            if (localStorage.getItem('otpDeliveryMethod') !== 'phone') {
                window.location.replace('otp-method.html');
                return;
            }
            try {
                const result = await window.UrskoolApi.request('api/auth.php?action=pending');
                pendingProfile = result.user;
                demoCode = result.demoCode || '';
                window.UrskoolApi.cacheUser(pendingProfile);
                if (!pendingProfile.phone) throw new Error('This account has no phone number.');
                phoneBox.textContent = pendingProfile.phone;
                await sendCode();
            } catch (error) {
                updateStatus(error.message || 'There is no pending phone verification.', 'error');
                resendBtn.disabled = true;
                continueBtn.disabled = true;
            }
        }

        inputs.forEach((input, index) => {
            input.addEventListener('input', event => {
                event.target.value = event.target.value.replace(/\D/g, '').slice(0, 1);
                if (event.target.value && index < inputs.length - 1) inputs[index + 1].focus();
                checkCompletion();
            });
            input.addEventListener('keydown', event => {
                if (event.key === 'Backspace' && !input.value && index > 0) inputs[index - 1].focus();
            });
            input.addEventListener('paste', event => {
                const pasted = (event.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, inputs.length);
                if (!pasted) return;
                event.preventDefault();
                pasted.split('').forEach((digit, digitIndex) => { inputs[digitIndex].value = digit; });
                inputs[Math.min(pasted.length, inputs.length - 1)].focus();
                checkCompletion();
            });
        });

        continueBtn.addEventListener('click', verifyCode);
        resendBtn.addEventListener('click', sendCode);
        window.addEventListener('urskool-firebase-phone-error', event => {
            updateStatus(event.detail || 'Firebase Phone Auth could not initialize.', 'error');
        });
        loadPendingVerification();
    </script>
</body>
</html>
