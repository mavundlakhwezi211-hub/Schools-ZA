<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search Results</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #f3f7ff 0%, #eef4fb 100%);
  color: #173b5e;
  padding: 24px 16px 110px;
  transition: background 0.3s ease, color 0.3s ease;
}
body.dark-mode {
  background: linear-gradient(135deg, #0d1a2b 0%, #091420 100%);
  color: #c8d8e8;
}
.container { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
.card {
  background: #fff;
  border: 1px solid rgba(23,59,94,0.08);
  border-radius: 22px;
  box-shadow: 0 12px 30px rgba(13,41,68,0.10);
  padding: 20px;
}
body.dark-mode .card { background: #132436; border-color: rgba(200,216,232,0.12); color:#c8d8e8; }
.header {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.title { font-size: 28px; font-weight: 700; }
.search-box {
  display: flex; gap: 10px; align-items: center;
}
.search-box input {
  width: 100%;
  border: 1px solid rgba(23,59,94,0.16);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  background: #fbfdff;
  color: #173b5e;
}
body.dark-mode .search-box input {
  background: #1a2e44;
  border-color: rgba(200,216,232,0.2);
  color: #c8d8e8;
}
button {
  border: none; border-radius: 12px; padding: 11px 16px; font-weight: 700; cursor: pointer;
  background: #173b5e; color: #fff; box-shadow: 0 8px 16px rgba(13,41,68,0.14);
}
button.secondary { background: #f4f7fb; color: #173b5e; box-shadow: none; border: 1px solid rgba(23,59,94,0.10); }
body.dark-mode button.secondary { background:#1a2e44; color:#c8d8e8; border-color: rgba(200,216,232,0.12); }
.section-heading {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px;
}
.section-title { font-size: 18px; font-weight: 700; }
.section-meta { font-size: 13px; color: #5d6f80; }
body.dark-mode .section-meta { color: #7a9dba; }
.post-list { display: grid; gap: 14px; }
.post-card {
  background: rgba(247,251,255,0.9);
  border: 1px solid rgba(23,59,94,0.08);
  border-radius: 18px; padding: 16px;
  display: grid; gap: 12px;
}
body.dark-mode .post-card { background: rgba(26,46,68,0.9); border-color: rgba(200,216,232,0.12); }
.post-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.post-author { display: flex; align-items: center; gap: 12px; }
.author-avatar {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #173b5e, #3a79b8); color: #fff; font-weight: 700;
}
.post-name { font-weight: 700; }
.post-role-time { font-size: 12px; color: #5d6f80; }
body.dark-mode .post-role-time { color: #7a9dba; }
.post-body { line-height: 1.65; color: #314a62; }
body.dark-mode .post-body { color: #d2dded; }
.post-image { border-radius: 14px; overflow: hidden; border: 1px solid rgba(23,59,94,0.08); background: #f7fbff; }
.post-image img { width: 100%; max-height: 420px; object-fit: cover; display: block; }
.empty {
  padding: 24px; border: 1px dashed rgba(23,59,94,0.2); border-radius: 16px; text-align: center; color: #5d6f80; background: rgba(251,253,255,0.8);
}
body.dark-mode .empty { color: #7a9dba; background: rgba(19,36,54,0.5); }
.bottom-tab-bar{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(480px, calc(100% - 26px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:999px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(23,59,94,0.12);box-shadow:0 18px 35px rgba(13,41,68,0.14);z-index:1000;
}
body.dark-mode .bottom-tab-bar{background:rgba(19,36,54,0.92);border-color:rgba(200,216,232,0.12);}
.tab-btn{
    flex:1;display:grid;place-items:center;width:56px;height:56px;border:none;background:transparent;color:#173b5e;border-radius:50%;text-decoration:none;font-size:28px;cursor:pointer;transition:all 0.2s ease;
}
.tab-btn.active{background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;box-shadow:0 10px 22px rgba(23,59,94,0.20);}
body.dark-mode .tab-btn{color:#c8d8e8;}
body.dark-mode .tab-btn.active{background:linear-gradient(135deg,#1e4a76,#2a6fa8);}
@media (max-width: 620px) {
  body { padding: 16px 12px 110px; }
  .card { padding: 16px; border-radius: 18px; }
  .header { flex-direction: column; align-items: stretch; }
  .title { font-size: 24px; }
  .search-box { flex-direction: column; }
  .search-box button { width: 100%; }
  .post-top { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
  <div class="container">
    <div class="card header">
      <div class="title">Search Results</div>
      <a href="admin-feed.html" style="color:inherit; text-decoration:none; font-weight:700;">← Back</a>
    </div>

    <div class="card">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Search this school community..." />
        <button type="button" id="runSearch">Search</button>
      </div>
    </div>

    <div class="card">
      <div class="section-heading">
        <div class="section-title">Results</div>
        <div class="section-meta" id="resultCount">0 results</div>
      </div>
      <div id="searchResults" class="post-list"></div>
    </div>
  </div>

  <div class="bottom-tab-bar" aria-label="Primary navigation">
    <a class="tab-btn" href="admin-feed.html" aria-label="Home" title="Home">⌂</a>
    <a class="tab-btn active" href="search-results.html" aria-label="Search" title="Search">⌕</a>
    <a class="tab-btn" href="inbox.html" aria-label="Inbox" title="Inbox">✉</a>
    <a class="tab-btn" href="settings.html" aria-label="Profile" title="Profile">◉</a>
  </div>

<script>
const profileStorageKey = 'schoolProfileData';
const feedStorageKey = 'schoolAdminFeed';
const savedProfile = JSON.parse(localStorage.getItem(profileStorageKey) || '{}');
const currentSchool = (savedProfile.schoolName || savedProfile.schoolSearch || '').toString().trim();
const searchInput = document.getElementById('searchInput');
const runSearch = document.getElementById('runSearch');
const resultCount = document.getElementById('resultCount');
const searchResults = document.getElementById('searchResults');

function readPosts() {
  try {
    const raw = localStorage.getItem(feedStorageKey);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (error) {
    return [];
  }
}

function normalizeText(value) {
  return (value || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

function getSchoolPosts() {
  const posts = readPosts();
  if (!currentSchool) return posts;
  return posts.filter(post => {
    const school = (post.schoolName || '').toString().trim();
    return !school || school.toLowerCase() === currentSchool.toLowerCase();
  });
}

function buildPostMarkup(post) {
  const initial = (post.author || 'A').charAt(0).toUpperCase();
  const imageMarkup = post.image ? `<div class="post-image"><img src="${post.image}" alt="Post image" /></div>` : '';
  return `
    <div class="post-card">
      <div class="post-top">
        <div class="post-author">
          <div class="author-avatar">${initial}</div>
          <div>
            <div class="post-name">${post.author || 'Administrator'}</div>
            <div class="post-role-time">${post.role || 'School Admin'} • ${post.time || 'Just now'}</div>
          </div>
        </div>
      </div>
      ${post.text ? `<div class="post-body">${post.text}</div>` : ''}
      ${imageMarkup}
    </div>
  `;
}

function readPolls() {
  try {
    const raw = localStorage.getItem('schoolPolls');
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (error) {
    return [];
  }
}

function buildPollMarkup(poll) {
  const totalVotes = (poll.options || []).reduce((sum, option) => sum + (option.votes || []).length, 0);
  return `
    <div class="post-card">
      <div class="post-top">
        <div class="post-author">
          <div class="author-avatar" style="background:linear-gradient(135deg,#6a1b9a,#8e24aa);">📊</div>
          <div>
            <div class="post-name">${poll.createdBy || 'Administrator'}</div>
            <div class="post-role-time">Poll • ${poll.schoolName || currentSchool || 'School'}</div>
          </div>
        </div>
      </div>
      <div class="post-body"><strong>Question:</strong> ${poll.question || 'Untitled poll'}</div>
      <div class="post-body">${totalVotes} vote${totalVotes === 1 ? '' : 's'} so far</div>
    </div>
  `;
}

function renderSearchResults() {
  const query = normalizeText(searchInput.value);
  const schoolPosts = getSchoolPosts();
  const schoolPolls = readPolls().filter(poll => {
    const pollSchool = (poll.schoolName || '').toString().trim();
    return !pollSchool || pollSchool.toLowerCase() === (currentSchool || '').toLowerCase();
  });

  const matchingPosts = !query ? schoolPosts.slice(0, 8) : schoolPosts.filter(post => {
    const haystack = normalizeText(`${post.text || ''} ${post.author || ''} ${post.role || ''} ${post.schoolName || ''}`);
    return haystack.includes(query);
  });

  const matchingPolls = !query ? schoolPolls.slice(0, 8) : schoolPolls.filter(poll => {
    const haystack = normalizeText(`${poll.question || ''} ${poll.createdBy || ''} ${poll.schoolName || ''}`);
    return haystack.includes(query);
  });

  const results = [...matchingPosts.map(post => ({ type: 'post', item: post })), ...matchingPolls.map(poll => ({ type: 'poll', item: poll }))]
    .sort((a, b) => {
      const aTime = a.type === 'post' ? (a.item.id ? Number(a.item.id) : 0) : new Date(a.item.createdAt || 0).getTime();
      const bTime = b.type === 'post' ? (b.item.id ? Number(b.item.id) : 0) : new Date(b.item.createdAt || 0).getTime();
      return bTime - aTime;
    });

  resultCount.textContent = `${results.length} result${results.length === 1 ? '' : 's'}`;

  if (!results.length) {
    searchResults.innerHTML = '<div class="empty">No results found for this school.</div>';
    return;
  }

  searchResults.innerHTML = results.map(item => item.type === 'post' ? buildPostMarkup(item.item) : buildPollMarkup(item.item)).join('');
}

const params = new URLSearchParams(window.location.search);
const initialQuery = params.get('q') || '';
searchInput.value = initialQuery;
runSearch.addEventListener('click', () => {
  const nextQuery = searchInput.value.trim();
  const params = new URLSearchParams();
  if (nextQuery) params.set('q', nextQuery);
  const url = `search-results.html${params.toString() ? '?' + params.toString() : ''}`;
  window.location.href = url;
});
searchInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    runSearch.click();
  }
});

renderSearchResults();

if (localStorage.getItem('schoolDarkMode') === 'true') {
  document.body.classList.add('dark-mode');
}
</script>
</body>
</html>
