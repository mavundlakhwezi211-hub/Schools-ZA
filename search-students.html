<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Learners</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{min-height:100vh;padding:24px 20px 112px;background:#f7faf8;color:#183d34;}
body.dark-mode{background:#101d19;color:#d6e6dd;}
.page{width:min(820px,100%);margin:0 auto;}
/* ===== Back button: circle + chevron (keeps this page's green palette) ===== */
.back-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:0 0 auto;border:2.5px solid currentColor;border-radius:50%;padding:0;background:transparent;color:#315d50;cursor:pointer;text-decoration:none;line-height:1;margin:6px 0;transition:transform .2s ease,opacity .2s ease;}
.back-btn .arrow{display:block;width:11px;height:11px;border-top:2.5px solid currentColor;border-left:2.5px solid currentColor;transform:rotate(-45deg);margin-left:4px;}
.back-btn:hover{color:#142f29;transform:scale(1.06);}
.back-btn:focus-visible{outline:2px solid #315d50;outline-offset:3px;}
body.dark-mode .back-btn{color:#a7c9b7;}
body.dark-mode .back-btn:hover{color:#d6e6dd;}
@media (max-width:540px){.back-btn{width:34px;height:34px;border-width:2px;}.back-btn .arrow{width:9px;height:9px;border-top-width:2px;border-left-width:2px;margin-left:3px;}}
header{padding:30px 0 22px;border-bottom:1px solid #cbd9d2;}
body.dark-mode header,body.dark-mode .result-summary,body.dark-mode .student-row{border-color:#35483e;}
h1{font-size:30px;line-height:1.15;}
.school{margin-top:7px;color:#63796f;font-size:14px;}
body.dark-mode .school,body.dark-mode label,body.dark-mode .result-summary,body.dark-mode .student-class,body.dark-mode .absence small,body.dark-mode .empty{color:#9db5a8;}
.search-wrap{padding:22px 0 14px;}
label{display:block;margin-bottom:8px;font-size:13px;font-weight:700;color:#536b60;}
input{width:100%;height:48px;padding:10px 4px;border:0;border-bottom:2px solid #78958a;border-radius:0;background:transparent;color:inherit;font-size:17px;outline:none;}
input:focus{border-bottom-color:#176d53;}
.result-summary{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #cbd9d2;color:#63796f;font-size:13px;}
.student-list{display:grid;}
.student-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:17px 0;border-bottom:1px solid #d8e2dd;}
.student-name{font-size:16px;font-weight:700;}
.student-class{margin-top:4px;color:#63796f;font-size:13px;}
.absence{text-align:right;white-space:nowrap;font-size:14px;font-weight:700;color:#a53f32;}
.absence small{display:block;margin-top:3px;color:#63796f;font-size:11px;font-weight:500;}
.empty{padding:24px 0;color:#63796f;}
.letter-heading{position:sticky;top:0;z-index:1;padding:13px 0 7px;border-bottom:1px solid #cbd9d2;background:#f7faf8;color:#176d53;font-size:15px;font-weight:800;letter-spacing:.08em;}
body.dark-mode .letter-heading{background:#101d19;border-color:#35483e;color:#8fd3b6;}
.bottom-tab-bar{position:fixed;left:50%;bottom:max(14px,2.5vh);transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:clamp(6px,2vw,12px);padding:clamp(8px,2vw,14px) clamp(10px,2.5vw,16px);border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(23,59,94,.12);box-shadow:0 18px 35px rgba(13,41,68,.14);z-index:1000;}
body.dark-mode .bottom-tab-bar{background:rgba(19,36,54,.92);border-color:rgba(200,216,232,.12);}
.tab-btn{flex:1;display:grid;place-items:center;width:clamp(48px,7vw,60px);height:clamp(48px,7vw,60px);border:0;background:transparent;color:#173b5e;border-radius:50%;text-decoration:none;font-size:clamp(23px,3.5vw,30px);cursor:pointer;}
.tab-btn.active{background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;}
body.dark-mode .tab-btn{color:#c8d8e8;}
body.dark-mode .tab-btn.active{background:linear-gradient(135deg,#1e4a76,#2a6fa8);}
@media(max-width:480px){body{padding:16px 16px 108px}.student-row{gap:10px}.absence{font-size:13px}.letter-heading{font-size:14px}}
</style>
</head>
<body>
<main class="page">
    <a href="school-learners.html" class="back-btn" aria-label="Go back to school learners"><span class="arrow"></span></a>
    <header>
        <h1>Search learners</h1>
        <p class="school" id="schoolName"></p>
    </header>
    <section class="search-wrap" aria-label="Search learners">
        <label for="studentSearch">Student name or class</label>
        <input id="studentSearch" type="search" placeholder="Type a letter or name..." autocomplete="off">
    </section>
    <div class="result-summary"><span id="resultCount">0 learners</span><span>Absence days</span></div>
    <section class="student-list" id="studentList" aria-live="polite"></section>
</main>
<div class="bottom-tab-bar" id="bottomTabBar" aria-label="Primary navigation"></div>
<script src="tab-bar.js"></script>
<script>
const profile=JSON.parse(localStorage.getItem('schoolProfileData')||'{}');
const school=(profile.schoolName||profile.schoolSearch||'').toString().trim();
const teacherId=(profile.email||profile.fullName||'teacher').toString().trim().toLowerCase();
const searchInput=document.getElementById('studentSearch');
const studentList=document.getElementById('studentList');
const resultCount=document.getElementById('resultCount');
document.getElementById('schoolName').textContent=school;
document.body.classList.toggle('dark-mode',localStorage.getItem('schoolDarkMode')==='true');

function readJson(key,fallback){try{const value=JSON.parse(localStorage.getItem(key)||'');return value??fallback;}catch(error){return fallback;}}
function getLearners(){
    const registry=readJson('schoolUsersRegistry',[]);
    if(!Array.isArray(registry))return [];
    const normalizedSchool=school.toLowerCase();
    return registry.filter(user=>(user.role||'').toString().trim().toLowerCase()==='student'&&normalizedSchool&&(user.schoolName||user.schoolSearch||'').toString().trim().toLowerCase()===normalizedSchool);
}
function learnerId(learner,index){return (learner.email||learner.phone||learner.attendanceId||learner.id||learner.fullName||`learner-${index}`).toString().trim().toLowerCase();}
function assignedClasses(id){
    const classes=readJson('schoolTeacherClasses',{})[teacherId];
    const rosters=readJson('schoolTeacherRosters',{});
    if(!Array.isArray(classes))return [];
    return classes.filter(className=>Array.isArray(rosters[`${teacherId}|${school.toLowerCase()}|${className}`])&&rosters[`${teacherId}|${school.toLowerCase()}|${className}`].includes(id));
}
function absenceDayCounts(){
    const attendance=readJson('schoolAttendance',{});
    const schoolKey=school.toLowerCase();
    const counts={};
    Object.entries(attendance&&typeof attendance==='object'?attendance:{}).forEach(([key,record])=>{
        if(!key.startsWith(`${schoolKey}|`)||!record||typeof record!=='object')return;
        const day=key.slice(key.lastIndexOf('|')+1);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return;
        Object.entries(record).forEach(([id,status])=>{
            if(status!=='A'&&status!=='absent')return;
            if(!counts[id])counts[id]=new Set();
            counts[id].add(day);
        });
    });
    return counts;
}
function nameLetter(learner){
    const match=(learner.fullName||'').trim().match(/[a-z]/i);
    return match?match[0].toUpperCase():'#';
}
function matchesSearch(item,query){
    const words=`${item.learner.fullName||''} ${item.learner.grade||''} ${item.classes.join(' ')}`.toLowerCase().split(/\s+/).filter(Boolean);
    return words.some(word=>word.startsWith(query));
}
function render(){
    const query=searchInput.value.trim().toLowerCase();
    if(!query){
        resultCount.textContent='Search to see learners';
        studentList.replaceChildren();
        const prompt=document.createElement('p');
        prompt.className='empty';
        prompt.textContent='Enter a learner name or class to begin.';
        studentList.append(prompt);
        return;
    }
    const entries=getLearners().map((learner,index)=>{
        const id=learnerId(learner,index);
        return {learner,index,id,classes:assignedClasses(id),letter:nameLetter(learner)};
    });
    if(!entries.length){
        resultCount.textContent='0 learners';
        studentList.replaceChildren();
        const empty=document.createElement('p');empty.className='empty';empty.textContent='No learners registered yet.';studentList.append(empty);
        return;
    }
    const learners=entries.filter(item=>matchesSearch(item,query));
    learners.sort((a,b)=>(a.learner.fullName||'').localeCompare(b.learner.fullName||''));
    resultCount.textContent=`${learners.length} learner${learners.length===1?'':'s'}`;
    studentList.replaceChildren();
    if(!learners.length){
        const empty=document.createElement('p');empty.className='empty';
        empty.textContent=`No learners match "${searchInput.value.trim()}".`;
        studentList.append(empty);return;
    }
    const counts=absenceDayCounts();
    let currentLetter='';
    learners.forEach(({learner,id,classes,letter})=>{
        if(letter!==currentLetter){
            currentLetter=letter;
            const heading=document.createElement('h2');heading.className='letter-heading';heading.textContent=letter;
            studentList.append(heading);
        }
        const row=document.createElement('article');row.className='student-row';
        const details=document.createElement('div');
        const name=document.createElement('h3');name.className='student-name';name.textContent=learner.fullName||'Unnamed learner';
        const grade=document.createElement('p');grade.className='student-class';grade.textContent=`Class ${classes.length?classes.join(', '):(learner.grade||'Unassigned')}`;
        details.append(name,grade);
        const absence=document.createElement('p');absence.className='absence';
        const count=counts[id]?counts[id].size:0;
        absence.append(document.createTextNode(`${count} day${count===1?'':'s'}`));
        const caption=document.createElement('small');caption.textContent='absent';absence.append(caption);
        row.append(details,absence);studentList.append(row);
    });
}
searchInput.addEventListener('input',render);
render();
</script>
</body>
</html>
