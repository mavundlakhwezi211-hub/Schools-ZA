<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{
    min-height:100vh;
    background:linear-gradient(135deg,#f3f7ff 0%, #eef4fb 100%);
    color:#173b5e;
    padding:24px 20px 100px;
}
body.dark-mode{
    background:linear-gradient(135deg,#0d1a2b 0%, #091420 100%);
    color:#c8d8e8;
}
.container{max-width:720px;margin:0 auto;display:grid;gap:18px;}
.card{background:#fff;border:1px solid rgba(23,59,94,0.08);border-radius:22px;box-shadow:0 12px 30px rgba(13,41,68,0.10);padding:22px;}
body.dark-mode .card{background:#132436;border-color:rgba(200,216,232,0.12);color:#c8d8e8;}
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.title{font-size:28px;font-weight:700;}
.back-link{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;text-decoration:none;background:#f4f7fb;color:#173b5e;font-weight:700;font-size:22px;border:1px solid rgba(23,59,94,0.08);}
body.dark-mode .back-link{background:#1a2e44;color:#c8d8e8;border-color:rgba(200,216,232,0.12);}
.profile-summary{display:flex;align-items:center;gap:16px;}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;font-size:30px;font-weight:700;overflow:hidden;}
.avatar.admin-avatar{cursor:pointer;transition:transform 0.2s ease,box-shadow 0.2s ease;}
.avatar.admin-avatar:hover{transform:scale(1.04);box-shadow:0 0 0 4px rgba(58,121,184,0.18);}
.avatar.admin-avatar:focus-visible{outline:3px solid #3a79b8;outline-offset:3px;}
.avatar.has-image{background-position:center;background-size:cover;background-repeat:no-repeat;}
.avatar-upload-input{display:none;}
.avatar-menu{position:absolute;top:84px;left:0;z-index:5;display:none;min-width:170px;padding:6px;background:#fff;border:1px solid rgba(23,59,94,0.12);border-radius:12px;box-shadow:0 10px 24px rgba(13,41,68,0.16);}
.avatar-menu.open{display:grid;gap:2px;}
.avatar-menu button{border:0;border-radius:8px;padding:9px 10px;background:transparent;color:#173b5e;text-align:left;font-size:13px;font-weight:600;cursor:pointer;}
.avatar-menu button:hover{background:#eef6ff;}
.avatar-menu button.delete-avatar{color:#b42318;}
.image-editor-overlay{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(7,18,32,0.58);}
.image-editor-overlay.open{display:flex;}
.image-editor{width:min(380px,100%);padding:20px;border-radius:18px;background:#fff;box-shadow:0 20px 50px rgba(7,18,32,0.3);}
.image-editor h2{margin-bottom:14px;color:#173b5e;font-size:18px;}
.crop-preview{width:min(300px,100%);aspect-ratio:1;margin:0 auto 16px;border-radius:50%;overflow:hidden;background:#eef4fb;}
.crop-preview canvas{display:block;width:100%;height:100%;}
.crop-control{display:grid;gap:7px;margin-bottom:14px;color:#5d6f80;font-size:13px;}
.crop-control input{width:100%;accent-color:#173b5e;}
.image-editor-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.image-editor-actions button{border:0;border-radius:10px;padding:10px 13px;background:#173b5e;color:#fff;font-weight:600;cursor:pointer;}
.image-editor-actions button.secondary{background:#f4f7fb;color:#173b5e;border:1px solid rgba(23,59,94,0.1);}
.image-editor-actions button:hover{background:#0f2a45;}
.image-editor-actions button.secondary:hover{background:#eaf2fa;}
body.dark-mode .image-editor{background:#132436;}
body.dark-mode .image-editor h2{color:#c8d8e8;}
body.dark-mode .crop-preview{background:#1a2e44;}
body.dark-mode .crop-control{color:#9bb3cc;}
body.dark-mode .image-editor-actions button.secondary{background:#1a2e44;color:#c8d8e8;border-color:rgba(200,216,232,0.12);}
body.dark-mode .image-editor-actions button.secondary:hover{background:#1e3a52;}
body.dark-mode .avatar-menu{background:#132436;border-color:rgba(200,216,232,0.12);box-shadow:0 10px 24px rgba(0,0,0,0.3);}
body.dark-mode .avatar-menu button{color:#c8d8e8;}
body.dark-mode .avatar-menu button:hover{background:#1e3a52;}
body.dark-mode .avatar-menu button.delete-avatar{color:#f08072;}
.name{font-size:24px;font-weight:700;}
.role{font-size:14px;color:#5d6f80;margin-top:4px;}
body.dark-mode .role{color:#7a9dba;}
.settings-list{display:grid;gap:12px;}
.setting-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:16px;background:#f7fbff;border:1px solid rgba(23,59,94,0.08);text-decoration:none;color:inherit;cursor:pointer;}
body.dark-mode .setting-item{background:#1a2e44;border-color:rgba(200,216,232,0.12);}
#classFormatMain{background:#f7fbff;border:1px solid rgba(23,59,94,0.08);transition:background 0.2s ease, border-color 0.2s ease;}
body.dark-mode #classFormatMain{background:#1a2e44;border-color:rgba(200,216,232,0.12);}
#classFormatSummary:hover #classFormatMain{background:#eaf2fa;}
body.dark-mode #classFormatSummary:hover #classFormatMain{background:#24405c;}
.setting-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.setting-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(23,59,94,0.08);font-size:20px;}
body.dark-mode .setting-icon{background:rgba(200,216,232,0.08);}
.setting-label{font-size:16px;font-weight:600;}
.setting-value{font-size:13px;color:#5d6f80;display:flex;align-items:center;gap:8px;}
body.dark-mode .setting-value{color:#7a9dba;}
.toggle{position:relative;width:52px;height:28px;border-radius:999px;background:#d3dbe6;transition:0.2s ease;}
.toggle::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.2);transition:0.2s ease;}
.toggle.active{background:#173b5e;}
body.dark-mode .toggle.active{background:#2a6fa8;}
.toggle.active::after{left:28px;}
.danger .setting-label{color:#b42318;}
.danger .setting-icon{background:rgba(180,35,24,0.12);}
.bottom-tab-bar{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(480px, calc(100% - 26px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:999px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(23,59,94,0.12);box-shadow:0 18px 35px rgba(13,41,68,0.14);z-index:1000;
}
body.dark-mode .bottom-tab-bar{background:rgba(19,36,54,0.92);border-color:rgba(200,216,232,0.12);}
.tab-btn{
    flex:1;display:grid;place-items:center;width:56px;height:56px;border:none;background:transparent;color:#173b5e;border-radius:50%;text-decoration:none;font-size:28px;cursor:pointer;transition:all 0.2s ease;
}
.tab-btn:hover{background:rgba(23,59,94,0.07);transform:translateY(-1px);}
.tab-btn.active{background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;box-shadow:0 10px 22px rgba(23,59,94,0.20);}
body.dark-mode .tab-btn{color:#c8d8e8;}
body.dark-mode .tab-btn.active{background:linear-gradient(135deg,#1e4a76,#2a6fa8);}
@media (max-width: 540px){
    body{padding:16px 12px 96px;}
    .card{padding:18px 16px;border-radius:18px;}
    .title{font-size:24px;}
    .profile-summary{gap:12px;}
    .avatar{width:60px;height:60px;font-size:24px;}
    .name{font-size:20px;}
    .setting-item{padding:14px 12px;}
    .setting-label{font-size:15px;}
    .tab-btn{width:52px;height:52px;font-size:24px;}
}
</style>
</head>
<body>
<div class="container">
    <div class="card header">
        <div class="title">Settings</div>
        <a class="back-link" href="admin-feed.html" aria-label="Back">←</a>
    </div>

    <div class="card profile-summary">
        <div style="position:relative;">
            <div class="avatar" id="userAvatar">U</div>
            <div class="avatar-menu" id="avatarMenu" role="menu">
                <button type="button" id="changeAvatarBtn" role="menuitem">Change picture</button>
                <button type="button" id="deleteAvatarBtn" class="delete-avatar" role="menuitem">Delete picture</button>
            </div>
        </div>
        <input class="avatar-upload-input" id="avatarUploadInput" type="file" accept="image/*">
        <div>
            <div class="name" id="userName">User</div>
            <div class="role" id="userRole">Role</div>
        </div>
    </div>

    <div class="card settings-list">
        <div class="setting-item" id="accountSummary" style="cursor:pointer;">
            <div class="setting-main">
                <div class="setting-icon">◌</div>
                <div>
                    <div class="setting-label">Account</div>
                    <div class="setting-value" id="accountSummaryText">View full details</div>
                </div>
            </div>
            <div class="setting-value">▾</div>
        </div>

        <div class="card" id="accountDetails" style="display:none; padding:18px; margin-top:-8px;">
            <div style="display:grid; gap:12px;">
                <div><strong>Full name:</strong> <span id="detailFullName">—</span></div>
                <div><strong>Email:</strong> <span id="detailEmail">—</span></div>
                <div><strong>Role:</strong> <span id="detailRole">—</span></div>
                <div><strong>School:</strong> <span id="detailSchool">—</span></div>
                <div id="detailGradeRow"><strong>Grade:</strong> <span id="detailGrade">—</span></div>
                <div><strong>Province:</strong> <span id="detailProvince">—</span></div>
            </div>
        </div>

        <a class="setting-item" href="edit-profile.html">
            <div class="setting-main">
                <div class="setting-icon">◌</div>
                <div class="setting-label">Edit profile</div>
            </div>
            <div class="setting-value">→</div>
        </a>

        <button class="setting-item" type="button" id="aboutButton">
            <div class="setting-main">
                <div class="setting-icon">ℹ</div>
                <div class="setting-label">About</div>
            </div>
            <div class="setting-value">→</div>
        </button>

        <button class="setting-item" type="button" id="darkModeButton">
            <div class="setting-main">
                <div class="setting-icon">☾</div>
                <div class="setting-label">Dark mode</div>
            </div>
            <div class="toggle" id="darkModeToggle"></div>
        </button>

        <div id="adminClassContainer" style="display:none;">
            <button class="setting-item" type="button" id="classFormatSummary" style="width:100%; border:none; background:transparent; padding:0; border-radius:16px; cursor:pointer;">
                <div class="setting-main" id="classFormatMain" style="padding:16px 18px; border-radius:16px;">
                    <div class="setting-icon">⌗</div>
                    <div>
                        <div class="setting-label">Class format</div>
                        <div class="setting-value" id="classFormatValue">Number format (e.g. 8.1)</div>
                    </div>
                </div>
                <div class="setting-value" style="padding-right:16px;">▾</div>
            </button>
            <div class="card" id="classFormatDetails" style="display:none; padding:18px; margin-top:-8px;">
                <div style="display:grid; gap:12px;">
                    <div style="font-size:13px; color:#5d6f80;">Choose how class names are shown at your school.</div>
                    <label style="display:flex; align-items:center; gap:10px; font-weight:600; cursor:pointer;">
                        <input type="radio" name="classFormat" id="classFormatNumber" value="number" />
                        Number format (e.g. 8.1)
                    </label>
                    <label style="display:flex; align-items:center; gap:10px; font-weight:600; cursor:pointer;">
                        <input type="radio" name="classFormat" id="classFormatLetter" value="letter" />
                        Letter format (e.g. 8A)
                    </label>
                </div>
            </div>
        </div>

        <button class="setting-item danger" type="button" id="logoutButton">
            <div class="setting-main">
                <div class="setting-icon">⇠</div>
                <div class="setting-label">Log out</div>
            </div>
            <div class="setting-value">→</div>
        </button>
    </div>
</div>

<div class="bottom-tab-bar" id="bottomTabBar" aria-label="Primary navigation"></div>

<div class="image-editor-overlay" id="imageEditorOverlay" role="dialog" aria-modal="true" aria-labelledby="imageEditorTitle">
    <div class="image-editor">
        <h2 id="imageEditorTitle">Adjust profile picture</h2>
        <div class="crop-preview"><canvas id="cropCanvas" width="600" height="600"></canvas></div>
        <label class="crop-control" for="cropZoom">Crop zoom
            <input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1">
        </label>
        <div class="image-editor-actions">
            <button type="button" class="secondary" id="rotateBtn" aria-label="Rotate picture">↻ Rotate</button>
            <button type="button" class="secondary" id="cancelImageEditBtn">Cancel</button>
            <button type="button" id="saveImageEditBtn">Save picture</button>
        </div>
    </div>
</div>

<script>
const profileStorageKey = 'schoolProfileData';
const savedProfile = JSON.parse(localStorage.getItem(profileStorageKey) || '{}');
const currentRole = (savedProfile.role || '').toString().trim().toLowerCase();

const userAvatar = document.getElementById('userAvatar');
const avatarUploadInput = document.getElementById('avatarUploadInput');
const avatarMenu = document.getElementById('avatarMenu');
const changeAvatarBtn = document.getElementById('changeAvatarBtn');
const deleteAvatarBtn = document.getElementById('deleteAvatarBtn');
const imageEditorOverlay = document.getElementById('imageEditorOverlay');
const cropCanvas = document.getElementById('cropCanvas');
const cropZoom = document.getElementById('cropZoom');
const rotateBtn = document.getElementById('rotateBtn');
const cancelImageEditBtn = document.getElementById('cancelImageEditBtn');
const saveImageEditBtn = document.getElementById('saveImageEditBtn');
const userName = document.getElementById('userName');
const userRole = document.getElementById('userRole');
const darkModeToggle = document.getElementById('darkModeToggle');
const darkModeButton = document.getElementById('darkModeButton');
const aboutButton = document.getElementById('aboutButton');
const logoutButton = document.getElementById('logoutButton');
const adminClassContainer = document.getElementById('adminClassContainer');
const classFormatSummary = document.getElementById('classFormatSummary');
const classFormatDetails = document.getElementById('classFormatDetails');
const classFormatValue = document.getElementById('classFormatValue');
const classFormatNumber = document.getElementById('classFormatNumber');
const classFormatLetter = document.getElementById('classFormatLetter');
const classFormatStorageKey = 'schoolClassFormat';
const accountSummary = document.getElementById('accountSummary');
const accountDetails = document.getElementById('accountDetails');
const detailFullName = document.getElementById('detailFullName');
const detailEmail = document.getElementById('detailEmail');
const detailRole = document.getElementById('detailRole');
const detailSchool = document.getElementById('detailSchool');
const detailGrade = document.getElementById('detailGrade');
const detailGradeRow = document.getElementById('detailGradeRow');
const detailProvince = document.getElementById('detailProvince');

const fullName = savedProfile.fullName || `${(savedProfile.firstName || '').trim()} ${(savedProfile.lastName || '').trim()}`.trim() || 'User';
const role = (savedProfile.role || 'User').replace(/\b\w/g, ch => ch.toUpperCase());
let imageEditorSource = null;
let imageEditorRotation = 0;

const avatarInitial = (fullName.charAt(0) || 'U').toUpperCase();
userAvatar.textContent = avatarInitial;
userName.textContent = fullName;
userRole.textContent = role;

function applyProfileImage(profileImage) {
    if (profileImage) {
        userAvatar.textContent = '';
        userAvatar.classList.add('has-image');
        userAvatar.style.backgroundImage = `url("${profileImage}")`;
        return;
    }

    userAvatar.textContent = avatarInitial;
    userAvatar.classList.remove('has-image');
    userAvatar.style.backgroundImage = '';
}

function syncProfileImageToRegistry(profileImage) {
    try {
        const registry = JSON.parse(localStorage.getItem('schoolUsersRegistry') || '[]');
        if (!Array.isArray(registry)) return;
        const school = (savedProfile.schoolName || savedProfile.schoolSearch || '').trim().toLowerCase();
        const email = (savedProfile.email || '').trim().toLowerCase();
        registry.forEach((user) => {
            const userEmail = (user.email || '').trim().toLowerCase();
            const userSchool = (user.schoolName || user.schoolSearch || '').trim().toLowerCase();
            if ((email && userEmail === email) || (!email && userSchool === school && user.fullName === fullName)) {
                if (profileImage) user.profileImage = profileImage;
                else delete user.profileImage;
            }
        });
        localStorage.setItem('schoolUsersRegistry', JSON.stringify(registry));
    } catch (error) {
        console.log('Unable to sync profile picture', error);
    }
}

function renderImageEditor() {
    if (!imageEditorSource) return;
    const context = cropCanvas.getContext('2d');
    const size = cropCanvas.width;
    const radians = imageEditorRotation * Math.PI / 180;
    const sourceWidth = imageEditorSource.width;
    const sourceHeight = imageEditorSource.height;
    const scale = Math.max(size / sourceWidth, size / sourceHeight) * Number(cropZoom.value);
    const drawWidth = sourceWidth * scale;
    const drawHeight = sourceHeight * scale;

    context.clearRect(0, 0, size, size);
    context.save();
    context.translate(size / 2, size / 2);
    context.rotate(radians);
    context.drawImage(imageEditorSource, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
    context.restore();
}

function openImageEditor(dataUrl) {
    const image = new Image();
    image.onload = function() {
        imageEditorSource = image;
        imageEditorRotation = 0;
        cropZoom.value = '1';
        renderImageEditor();
        imageEditorOverlay.classList.add('open');
    };
    image.src = dataUrl;
}

function closeImageEditor() {
    imageEditorOverlay.classList.remove('open');
    imageEditorSource = null;
}

function saveEditedImage() {
    if (!imageEditorSource) return;
    const editedImage = cropCanvas.toDataURL('image/jpeg', 0.9);
    savedProfile.profileImage = editedImage;
    localStorage.setItem(profileStorageKey, JSON.stringify(savedProfile));
    syncProfileImageToRegistry(editedImage);
    applyProfileImage(editedImage);
    closeImageEditor();
}

cropZoom.addEventListener('input', renderImageEditor);
rotateBtn.addEventListener('click', function() {
    imageEditorRotation = (imageEditorRotation + 90) % 360;
    renderImageEditor();
});
cancelImageEditBtn.addEventListener('click', closeImageEditor);
saveImageEditBtn.addEventListener('click', saveEditedImage);
imageEditorOverlay.addEventListener('click', function(event) {
    if (event.target === imageEditorOverlay) closeImageEditor();
});

if (isAdminRole()) {
    userAvatar.classList.add('admin-avatar');
    userAvatar.setAttribute('role', 'button');
    userAvatar.setAttribute('tabindex', '0');
    userAvatar.setAttribute('aria-label', 'Change profile picture');
    userAvatar.title = 'Change profile picture';
    userAvatar.addEventListener('click', function() {
        avatarMenu.classList.toggle('open');
    });
    userAvatar.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            avatarMenu.classList.toggle('open');
        }
    });
    changeAvatarBtn.addEventListener('click', function() {
        avatarMenu.classList.remove('open');
        avatarUploadInput.click();
    });
    deleteAvatarBtn.addEventListener('click', function() {
        avatarMenu.classList.remove('open');
        if (!savedProfile.profileImage || !confirm('Delete your profile picture?')) return;
        delete savedProfile.profileImage;
        localStorage.setItem(profileStorageKey, JSON.stringify(savedProfile));
        syncProfileImageToRegistry('');
        applyProfileImage('');
    });
    document.addEventListener('click', function(event) {
        if (!userAvatar.contains(event.target) && !avatarMenu.contains(event.target)) {
            avatarMenu.classList.remove('open');
        }
    });
    avatarUploadInput.addEventListener('change', function() {
        const file = avatarUploadInput.files && avatarUploadInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('Please choose an image file.');
            avatarUploadInput.value = '';
            return;
        }
        if (file.size > 2 * 1024 * 1024) {
            alert('Please choose an image smaller than 2 MB.');
            avatarUploadInput.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = function() {
            openImageEditor(reader.result);
        };
        reader.readAsDataURL(file);
    });
    applyProfileImage(savedProfile.profileImage);
}

detailFullName.textContent = fullName || '—';
detailEmail.textContent = savedProfile.email || '—';
detailRole.textContent = role || '—';
detailSchool.textContent = savedProfile.schoolName || savedProfile.schoolSearch || '—';
detailGrade.textContent = savedProfile.grade || '—';
detailProvince.textContent = savedProfile.province || '—';

// Only show Grade for students
if (currentRole !== 'student') {
    detailGradeRow.style.display = 'none';
}

function loadDarkMode() {
    const isDark = localStorage.getItem('schoolDarkMode') === 'true';
    document.body.classList.toggle('dark-mode', isDark);
    darkModeToggle.classList.toggle('active', isDark);
}

function toggleDarkMode() {
    const isDark = !document.body.classList.contains('dark-mode');
    document.body.classList.toggle('dark-mode', isDark);
    darkModeToggle.classList.toggle('active', isDark);
    localStorage.setItem('schoolDarkMode', isDark);
}

function isAdminRole() {
    return currentRole === 'administrator' || currentRole === 'admin';
}

function getClassFormat() {
    return localStorage.getItem(classFormatStorageKey) || 'number';
}

function updateClassFormatUI() {
    const format = getClassFormat();
    if (classFormatNumber) classFormatNumber.checked = format === 'number';
    if (classFormatLetter) classFormatLetter.checked = format === 'letter';
    if (classFormatValue) {
        classFormatValue.textContent = format === 'letter' ? 'Letter format (e.g. 8A)' : 'Number format (e.g. 8.1)';
    }
}

// Show the class format setting only for administrators
if (isAdminRole()) {
    adminClassContainer.style.display = 'block';
    updateClassFormatUI();
}

accountSummary.addEventListener('click', function() {
    const open = accountDetails.style.display !== 'none';
    accountDetails.style.display = open ? 'none' : 'block';
});

darkModeButton.addEventListener('click', toggleDarkMode);

if (classFormatSummary && classFormatDetails) {
    classFormatSummary.addEventListener('click', function() {
        const open = classFormatDetails.style.display !== 'none';
        classFormatDetails.style.display = open ? 'none' : 'block';
    });

    classFormatNumber.addEventListener('change', function() {
        if (classFormatNumber.checked) {
            localStorage.setItem(classFormatStorageKey, 'number');
            updateClassFormatUI();
        }
    });

    classFormatLetter.addEventListener('change', function() {
        if (classFormatLetter.checked) {
            localStorage.setItem(classFormatStorageKey, 'letter');
            updateClassFormatUI();
        }
    });
}

aboutButton.addEventListener('click', function() {
    window.location.href = 'admin-feed.html#about';
});

logoutButton.addEventListener('click', function() {
    if (confirm('Are you sure you want to log out?')) {
        localStorage.removeItem(profileStorageKey);
        window.location.href = 'index.html';
    }
});

loadDarkMode();
</script>
<script src="tab-bar.js"></script>
</body>
</html>
