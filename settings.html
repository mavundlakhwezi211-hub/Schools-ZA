<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{
    min-height:100vh;
    background:linear-gradient(135deg,#f3f7ff 0%, #eef4fb 100%);
    color:#173b5e;
    padding:24px 20px 100px;
}
body.dark-mode{
    background:linear-gradient(135deg,#0d1a2b 0%, #091420 100%);
    color:#c8d8e8;
}
.container{max-width:720px;margin:0 auto;display:grid;gap:18px;}
.card{background:#fff;border:1px solid rgba(23,59,94,0.08);border-radius:22px;box-shadow:0 12px 30px rgba(13,41,68,0.10);padding:22px;}
body.dark-mode .card{background:#132436;border-color:rgba(200,216,232,0.12);color:#c8d8e8;}
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.title{font-size:28px;font-weight:700;}
.back-link{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;text-decoration:none;background:#f4f7fb;color:#173b5e;font-weight:700;font-size:22px;border:1px solid rgba(23,59,94,0.08);}
body.dark-mode .back-link{background:#1a2e44;color:#c8d8e8;border-color:rgba(200,216,232,0.12);}
.profile-summary{display:flex;align-items:center;gap:16px;}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;font-size:30px;font-weight:700;}
.name{font-size:24px;font-weight:700;}
.role{font-size:14px;color:#5d6f80;margin-top:4px;}
body.dark-mode .role{color:#7a9dba;}
.settings-list{display:grid;gap:12px;}
.setting-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:16px;background:#f7fbff;border:1px solid rgba(23,59,94,0.08);text-decoration:none;color:inherit;cursor:pointer;}
body.dark-mode .setting-item{background:#1a2e44;border-color:rgba(200,216,232,0.12);}
.setting-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.setting-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(23,59,94,0.08);font-size:20px;}
body.dark-mode .setting-icon{background:rgba(200,216,232,0.08);}
.setting-label{font-size:16px;font-weight:600;}
.setting-value{font-size:13px;color:#5d6f80;display:flex;align-items:center;gap:8px;}
body.dark-mode .setting-value{color:#7a9dba;}
.toggle{position:relative;width:52px;height:28px;border-radius:999px;background:#d3dbe6;transition:0.2s ease;}
.toggle::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.2);transition:0.2s ease;}
.toggle.active{background:#173b5e;}
body.dark-mode .toggle.active{background:#2a6fa8;}
.toggle.active::after{left:28px;}
.danger .setting-label{color:#b42318;}
.danger .setting-icon{background:rgba(180,35,24,0.12);}
.bottom-tab-bar{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(480px, calc(100% - 26px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:999px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(23,59,94,0.12);box-shadow:0 18px 35px rgba(13,41,68,0.14);z-index:1000;
}
body.dark-mode .bottom-tab-bar{background:rgba(19,36,54,0.92);border-color:rgba(200,216,232,0.12);}
.tab-btn{
    flex:1;display:grid;place-items:center;width:56px;height:56px;border:none;background:transparent;color:#173b5e;border-radius:50%;text-decoration:none;font-size:28px;cursor:pointer;transition:all 0.2s ease;
}
.tab-btn:hover{background:rgba(23,59,94,0.07);transform:translateY(-1px);}
.tab-btn.active{background:linear-gradient(135deg,#173b5e,#3a79b8);color:#fff;box-shadow:0 10px 22px rgba(23,59,94,0.20);}
body.dark-mode .tab-btn{color:#c8d8e8;}
body.dark-mode .tab-btn.active{background:linear-gradient(135deg,#1e4a76,#2a6fa8);}
@media (max-width: 540px){
    body{padding:16px 12px 96px;}
    .card{padding:18px 16px;border-radius:18px;}
    .title{font-size:24px;}
    .profile-summary{gap:12px;}
    .avatar{width:60px;height:60px;font-size:24px;}
    .name{font-size:20px;}
    .setting-item{padding:14px 12px;}
    .setting-label{font-size:15px;}
    .tab-btn{width:52px;height:52px;font-size:24px;}
}
</style>
</head>
<body>
<div class="container">
    <div class="card header">
        <div class="title">Settings</div>
        <a class="back-link" href="admin-feed.html" aria-label="Back">←</a>
    </div>

    <div class="card profile-summary">
        <div class="avatar" id="userAvatar">U</div>
        <div>
            <div class="name" id="userName">User</div>
            <div class="role" id="userRole">Role</div>
        </div>
    </div>

    <div class="card settings-list">
        <div class="setting-item" id="accountSummary" style="cursor:pointer;">
            <div class="setting-main">
                <div class="setting-icon">◌</div>
                <div>
                    <div class="setting-label">Account</div>
                    <div class="setting-value" id="accountSummaryText">View full details</div>
                </div>
            </div>
            <div class="setting-value">▾</div>
        </div>

        <div class="card" id="accountDetails" style="display:none; padding:18px; margin-top:-8px;">
            <div style="display:grid; gap:12px;">
                <div><strong>Full name:</strong> <span id="detailFullName">—</span></div>
                <div><strong>Email:</strong> <span id="detailEmail">—</span></div>
                <div><strong>Role:</strong> <span id="detailRole">—</span></div>
                <div><strong>School:</strong> <span id="detailSchool">—</span></div>
                <div><strong>Grade:</strong> <span id="detailGrade">—</span></div>
                <div><strong>Province:</strong> <span id="detailProvince">—</span></div>
            </div>
        </div>

        <a class="setting-item" href="edit-profile.html">
            <div class="setting-main">
                <div class="setting-icon">◌</div>
                <div class="setting-label">Edit profile</div>
            </div>
            <div class="setting-value">→</div>
        </a>

        <button class="setting-item" type="button" id="aboutButton">
            <div class="setting-main">
                <div class="setting-icon">ℹ</div>
                <div class="setting-label">About</div>
            </div>
            <div class="setting-value">→</div>
        </button>

        <button class="setting-item" type="button" id="darkModeButton">
            <div class="setting-main">
                <div class="setting-icon">☾</div>
                <div class="setting-label">Dark mode</div>
            </div>
            <div class="toggle" id="darkModeToggle"></div>
        </button>

        <button class="setting-item danger" type="button" id="logoutButton">
            <div class="setting-main">
                <div class="setting-icon">⇠</div>
                <div class="setting-label">Log out</div>
            </div>
            <div class="setting-value">→</div>
        </button>
    </div>
</div>

<div class="bottom-tab-bar" aria-label="Primary navigation">
    <a class="tab-btn" href="admin-feed.html" aria-label="Home" title="Home">⌂</a>
    <button class="tab-btn" type="button" aria-label="Search" title="Search">⌕</button>
    <a class="tab-btn" href="inbox.html" aria-label="Inbox" title="Inbox">✉</a>
    <a class="tab-btn active" href="settings.html" aria-label="Profile" title="Profile">◉</a>
</div>

<script>
const profileStorageKey = 'schoolProfileData';
const savedProfile = JSON.parse(localStorage.getItem(profileStorageKey) || '{}');
const userAvatar = document.getElementById('userAvatar');
const userName = document.getElementById('userName');
const userRole = document.getElementById('userRole');
const darkModeToggle = document.getElementById('darkModeToggle');
const darkModeButton = document.getElementById('darkModeButton');
const aboutButton = document.getElementById('aboutButton');
const logoutButton = document.getElementById('logoutButton');
const accountSummary = document.getElementById('accountSummary');
const accountDetails = document.getElementById('accountDetails');
const detailFullName = document.getElementById('detailFullName');
const detailEmail = document.getElementById('detailEmail');
const detailRole = document.getElementById('detailRole');
const detailSchool = document.getElementById('detailSchool');
const detailGrade = document.getElementById('detailGrade');
const detailProvince = document.getElementById('detailProvince');

const fullName = savedProfile.fullName || `${(savedProfile.firstName || '').trim()} ${(savedProfile.lastName || '').trim()}`.trim() || 'User';
const role = (savedProfile.role || 'User').replace(/\b\w/g, ch => ch.toUpperCase());

userAvatar.textContent = (fullName.charAt(0) || 'U').toUpperCase();
userName.textContent = fullName;
userRole.textContent = role;

detailFullName.textContent = fullName || '—';
detailEmail.textContent = savedProfile.email || '—';
detailRole.textContent = role || '—';
detailSchool.textContent = savedProfile.schoolName || savedProfile.schoolSearch || '—';
detailGrade.textContent = savedProfile.grade || '—';
detailProvince.textContent = savedProfile.province || '—';

function loadDarkMode() {
    const isDark = localStorage.getItem('schoolDarkMode') === 'true';
    document.body.classList.toggle('dark-mode', isDark);
    darkModeToggle.classList.toggle('active', isDark);
}

function toggleDarkMode() {
    const isDark = !document.body.classList.contains('dark-mode');
    document.body.classList.toggle('dark-mode', isDark);
    darkModeToggle.classList.toggle('active', isDark);
    localStorage.setItem('schoolDarkMode', isDark);
}

accountSummary.addEventListener('click', function() {
    const open = accountDetails.style.display !== 'none';
    accountDetails.style.display = open ? 'none' : 'block';
});

darkModeButton.addEventListener('click', toggleDarkMode);

aboutButton.addEventListener('click', function() {
    window.location.href = 'admin-feed.html#about';
});

logoutButton.addEventListener('click', function() {
    if (confirm('Are you sure you want to log out?')) {
        localStorage.removeItem(profileStorageKey);
        window.location.href = 'index.html';
    }
});

loadDarkMode();
</script>
</body>
</html>
